name: Security Audit

# Weekly cargo-audit run over Cargo.lock. Reports RustSec advisories that
# affect any transitive dependency in the workspace. Not a PR gate; a red run
# on main is the triage signal. cargo-audit is a prebuilt binary from
# taiki-e/install-action because building it from source (rustsec/audit-check
# does) breaks whenever its dependency tree bumps MSRV past the runner's rustc.
# It only reads Cargo.lock, so it runs on Linux and takes no macOS slot.

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1, bundles cargo-audit 0.22.2; bump if advisory-db parsing breaks
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
