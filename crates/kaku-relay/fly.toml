# fly.toml app configuration file generated for kaku-relay on 2026-03-25T12:55:28+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kaku-relay'
primary_region = 'nrt'

[build]

# The web terminal page lives on its own origin; the relay redirects old page
# addresses there and admits browser sockets only from it.
[env]
  KAKU_RELAY_PAGE_ORIGIN = 'https://t.kaku.fun'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Every Mac with remote access on holds a socket all day, and each open
  # page another, so 400 is about 200 people online. Memory bounds it, not
  # fly's proxy: a release build load test (2026-10-17) held 400 Macs plus
  # 200 pages each receiving 15 KB/s at 88 MB, every frame delivered, which
  # leaves room in 256 MB for the relay-wide queue budget (96 MB). Raise it
  # only with a new load test or a larger machine.
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 300
    hard_limit = 400

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
