    // Opening the drawer puts the keyboard away.
    if (open) document.activeElement?.blur();
  };
  const mobileRow = (id) => mobileList.querySelector(`.mobile-row[data-tab="${id}"]`);
  const renderMobileTabs = () => {
    const current = tabs.find(t => t.tab_id === tabId);
    mobileSwitch.querySelector(".name").textContent = current ? plainTitle(current) : "No tabs";
    // Another tab wanting you marks the drawer's button, since it is shut.
    mobileSwitch.classList.toggle("waiting", tabs.some(t => t.tab_id !== tabId && wantsYou(t)));
    document.querySelector("#mobile-head .count").textContent = tabs.length;
    mobileList.textContent = "";
    for (const t of tabs) {
      const title = plainTitle(t);
      const row = document.createElement("div");
      row.className = "mobile-row" + (t.tab_id === tabId ? " current" : "");
      row.dataset.tab = String(t.tab_id);
      const select = document.createElement("button");
      select.type = "button";
      select.className = "mobile-select";
      if (t.tab_id === tabId) select.setAttribute("aria-current", "true");
      const head = document.createElement("span");
      head.className = "mobile-title";
      const label = document.createElement("span");
      label.className = "mobile-label";

      head.append(label);
      if (wantsYou(t)) {

        dot.className = "mobile-dot";
        dot.setAttribute("aria-label", "needs attention");
        head.append(dot);

        sub.className = "mobile-sub";

      more.type = "button";
      more.className = "mobile-more";
      more.setAttribute("aria-label", `More for ${title}`);
      more.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>';
      more.addEventListener("click", () => {
        const r = more.getBoundingClientRect();
        openMenu(r.left, r.bottom, [
          ["Rename Tab", () => renameTab(t)],
          null,
          ["Close Tab", () => closeTab(t, () => mobileRow(t.tab_id)?.querySelector(".mobile-more"))],
        ]);
      });
      row.append(select, more);
      mobileList.append(row);
    }
  };
  mobileSwitch.addEventListener("click", () => setMobileOpen(true));
  mobileShade.addEventListener("click", () => setMobileOpen(false));
  document.getElementById("mobile-new").addEventListener("click", () => { newTab(); setMobileOpen(false); });
  window.addEventListener("keydown", ev => {
    if (dialogDone || menuEl.classList.contains("show") || renaming) return;
    if (ev.key === "Escape" && mobileTabs.classList.contains("show")) { ev.preventDefault(); ev.stopImmediatePropagation(); setMobileOpen(false); }
  }, true);
  PHONE_QUERY.addEventListener("change", () => {
    phone = TOUCH && PHONE_QUERY.matches;
    document.body.classList.toggle("phone", phone);
    if (!phone) setMobileOpen(false);
  });
  const clearDropMarks = () => tabsEl.querySelectorAll(".drop-before, .drop-after").forEach((e) => e.classList.remove("drop-before", "drop-after"));
  // Kaku's own order is per window; the page lists every window's tabs in a
  // row, so a move is told to the Mac as an index within that window.
  const moveTab = (from, to, after) => {
    const same = tabs.filter((x) => x.window_id === from.window_id);
    const rest = same.filter((x) => x !== from);
    let idx = rest.indexOf(to) + (after ? 1 : 0);
    if (same.indexOf(from) === idx) return;
    rest.splice(idx, 0, from);
    const others = tabs.filter((x) => x.window_id !== from.window_id);
    const firstAt = tabs.findIndex((x) => x.window_id === from.window_id);
    tabs = [...others.slice(0, firstAt), ...rest, ...others.slice(firstAt)];
    renderTabs();
    send({ type: "move_tab", tab_id: from.tab_id, index: idx });
  };
  // The tab bar is rebuilt whenever a title changes, so a menu opened a
  // moment ago may hold a button that is gone; edit the one on the page.
  const renameTab = (t) => {
    if (renaming) return;
    // On a phone the drawer's row takes the editor, in place of its button.
    const b = phone ? mobileRow(t.tab_id) : tabsEl.querySelector(`.tab[data-tab="${t.tab_id}"]`);
    const label = b && b.querySelector(phone ? ".mobile-select" : "span");
    if (!label) return;
    const input = document.createElement("input");
    const initial = phone ? plainTitle(t) : label.textContent;
    input.value = initial;
    input.spellcheck = false;
    if (!phone) input.style.width = Math.max(4, initial.length + 1) + "ch";
    renaming = t.tab_id;
    label.replaceWith(input);
    b.draggable = false;
    input.focus();
    input.select();
    let done = false;
    const finish = (apply) => {
      if (done) return;
      done = true;
      renaming = null;
      const value = input.value.trim();
      // Untouched leaves the computed title alone, as Kaku's editor does.
      if (apply && value !== initial) {
        t.title = value || t.title;
        send({ type: "rename_tab", tab_id: t.tab_id, title: value });
      }
      renderTabs();
      refocus();
    };
    input.addEventListener("input", () => { if (!phone) input.style.width = Math.max(4, input.value.length + 1) + "ch"; });
    input.addEventListener("keydown", (ev) => {
      ev.stopPropagation();
      if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
      else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
    });
    input.addEventListener("blur", () => finish(true));
    input.addEventListener("click", (ev) => ev.stopPropagation());
    input.addEventListener("dblclick", (ev) => ev.stopPropagation());
  };
  // More tabs than fit: fade the side that has more, and a vertical wheel
  // scrolls them sideways.
  const tabsEdge = () => {
    tabsEl.classList.toggle("more-left", tabsEl.scrollLeft > 2);
    tabsEl.classList.toggle("more-right", tabsEl.scrollLeft + tabsEl.clientWidth < tabsEl.scrollWidth - 2);
  };
  tabsEl.addEventListener("scroll", tabsEdge, { passive: true });
  new ResizeObserver(tabsEdge).observe(tabsEl);
  tabsEl.addEventListener("wheel", (ev) => {
    if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
    ev.preventDefault();
    tabsEl.scrollLeft += ev.deltaY;
  }, { passive: false });

  // A tab split into panes shows its layout; click a pane to view it, which
  // also focuses it on the Mac.
  const panesTool = document.createElement("div");
  panesTool.className = "tool panes";
  panesTool.title = "Panes in this tab";
  toolsEl.prepend(panesTool);

  // The agent title for the tab on view, from Kaku's own (its spinner
  // already stripped). Marks: Lobe Icons, as drawn by Kaku (agent_marks.rs);
  // pi's is drawn there by hand, since Lobe Icons has no pi icon.
  const AGENT_MARKS = {

  const agentTool = document.createElement("div");

  const currentAgent = () => tabs.find((t) => t.tab_id === tabId)?.agent || null;
  // Kaku Assistant's chat covers this pane on the Mac, where the page

  const renderStatus = () => {

    const t = tabs.find((x) => x.tab_id === tabId);
    const chat = !!t && paneId !== null && (t.ai_chat || []).includes(paneId);

      chatNotice = true;

    }
  };
  const renderPanes = () => {
    const t = tabs.find((x) => x.tab_id === tabId);
    const list = (t && t.panes) || [];

    panesTool.textContent = "";

    const h = Math.max(...list.map((p) => p.top + p.height));
    const map = document.createElement("div");
    map.className = "map";
    for (const p of list) {
      const box = document.createElement("button");
      box.type = "button";
      box.tabIndex = -1;

      box.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (p.pane_id !== paneId) {
          paneChosen = { id: p.pane_id, until: Date.now() + 3000 };
          attach({ tab_id: t.tab_id, pane_id: p.pane_id }, true);
        }

    panesTool.append(map);
  };

  // Tab menu, in the page's own style.
  const menuEl = document.getElementById("menu");
  const closeMenu = () => menuEl.classList.remove("show");
  const openMenu = (x, y, items) => {
    menuEl.textContent = "";
    for (const item of items) {
      if (!item) { menuEl.append(document.createElement("hr")); continue; }
      const mb = document.createElement("button");
      mb.type = "button";
      mb.textContent = item[0];

      menuEl.append(mb);
    }

    const r = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px";
    menuEl.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";
  };
  document.addEventListener("pointerdown", (ev) => { if (!menuEl.contains(ev.target)) closeMenu(); }, true);
  window.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && menuEl.classList.contains("show")) { ev.preventDefault(); ev.stopPropagation(); closeMenu(); } }, true);
  window.addEventListener("blur", closeMenu);

  const closePane = (target, at) => {
    const tab = tabs.find(t => t.pane_id === target || (t.panes || []).some(p => p.pane_id === target));
    if (!tab) return;
    if (!tab.panes || tab.panes.length < 2) { closeTab(tab, at); return; }
    const pane = tab.panes.find(p => p.pane_id === target);
    const go = () => send({ type: "close_pane", pane_id: target });
    if (pane?.confirm_close !== false) askClose(tab.title || "Pane", "pane", at).then(ok => { if (ok) go(); });
    else go();
  };
  stage.addEventListener("contextmenu", ev => {
    if (findEl.contains(ev.target) || !termEl.contains(ev.target) && !pastEl.contains(ev.target)) return;
    // Keep the phone's native selection handles and Copy menu.
    if (TOUCH || paneId === null) return;
    ev.preventDefault();
    const target = paneId;
    const selected = pastOpen ? historySelection() : liveSelection();
    const items = [];
    if (selected) items.push(["Copy", () => {
      pendingCopy = null;
      if (!navigator.clipboard) { toast(`The browser blocked copying. Press ${IS_MAC ? "Cmd" : "Ctrl"}+C instead.`); return; }
      navigator.clipboard.writeText(selected).catch(() => toast(`The browser blocked copying. Press ${IS_MAC ? "Cmd" : "Ctrl"}+C instead.`));
    }]);
    items.push(["Paste", async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (paneId !== target) { toast("Pane changed. Paste again in the target pane."); return; }
        pasteText(text);
        refocus();
      } catch (_) { toast(`The browser blocked pasting. Press ${IS_MAC ? "Cmd" : "Ctrl"}+V instead.`); }
    }], ["Search", openFind], null);
    for (const direction of ["Left", "Right", "Up", "Down"]) {
      items.push(["Split " + direction, () => send({ type: "split_pane", pane_id: target, direction })]);
    }
    const here = tabs.find((t) => t.tab_id === tabId);
    if (here && (here.panes || []).length > 1) {
      items.push(null, [here.zoomed ? "Unzoom Pane" : "Zoom Pane", () => send({ type: "zoom_pane", pane_id: target })]);
    }
    items.push(null, ["Close Pane", () => closePane(target, { x: ev.clientX, y: ev.clientY })]);

  // After picking a split in the page, the Mac reports its new focused
  // pane a moment later; until then the old one is not a reason to follow.
  let paneChosen = { id: null, until: 0 };
  const onTabs = (list) => {
    authoritativeTabs = list;
    const now = Date.now();
    for (const [id, until] of closing) {
      if (now > until || !list.some((t) => t.tab_id === id)) closing.delete(id);
    }
    tabs = list.filter((t) => !closing.has(t.tab_id));
    const livePanes = new Set(list.flatMap(t => (t.panes?.length ? t.panes : [{ pane_id: t.pane_id }]).map(p => p.pane_id)));
    for (const id of snapshots.keys()) if (!livePanes.has(id)) snapshots.delete(id);
    attentionTabs = tabs.some((t) => (t.title || "").endsWith("\u2022"));
    renderStatus();
    if (followNewTab) {
      const fresh = tabs.find((t) => !followNewTab.has(t.tab_id));
      if (fresh) { followNewTab = null; attach(fresh); return; }
      if (Date.now() > followUntil) followNewTab = null;
    }
    const current = tabs.find((t) => t.tab_id === tabId);
    // Split or joined on the Mac: a tab back to one pane is the page's to
    // size again, and a split one is shown at the Mac's size.
    const split = splitView();
    if (split !== wasSplit) { wasSplit = split; claimed = ""; fit(); }
    if (!current) {
      let saved = null;
      try { saved = Number(localStorage.getItem("kaku.tab")); } catch (_) {}
      const target = tabs.find((t) => t.tab_id === saved) || tabs.find((t) => t.active) || tabs[0];
      if (target) { clearNotice("tabs"); attach(target); }
      else { renderTabs(); setNotice("No tabs open", "Open one with the + button.", { kind: "tabs" }); }
    } else if (current.pane_id !== paneId && !(paneChosen.id === paneId && Date.now() < paneChosen.until && (current.panes || []).some((p) => p.pane_id === paneId))) {
      // Follow the tab when focus moves to another split on the Mac.
      attach(current);

      renderTabs();

  };

  let copyOnSelect = true;
  // Kaku Desktop: the Mac's own screen, offered when Kaku has its helper.
  // Its code loads only then, from desktop.js.
  let desktop = null;
  let desktopLoading = false;
  const loadDesktop = () => {
    if (desktopLoading) return;
    desktopLoading = true;
    const script = document.createElement("script");
    script.src = "assets/desktop.js";
    script.onload = () => {
      desktop = window.KakuDesktop.init({
        send, toolsEl, stageEl: document.getElementById("stage"), isMac: IS_MAC, touch: TOUCH, toast, focusTerminal: () => { refocus(); reclaim(); }, terminalKeys: LOCKED_KEYS,
        beforeEnter: () => {
          stopScrolling();
          closePast();
          pinchFrom = 0;
          pinchRatio = 1;
          termEl.style.transform = "";
        },
      });
    };
    script.onerror = () => { desktopLoading = false; };
    document.head.append(script);
  };

  const onConfig = (cfg) => {
    verifyDigest = !!cfg.verify_digest;
    if (cfg.desktop) loadDesktop();
    desktop?.sessionStarted();
    if (typeof cfg.compose_right_option === "boolean") composeOption = { left: !!cfg.compose_left_option, right: cfg.compose_right_option };
    copyOnSelect = cfg.copy_on_select !== false;
    const theme = {};
    if (cfg.background) { theme.background = cfg.background; document.documentElement.style.setProperty("--bg", cfg.background); }
    if (cfg.foreground) { theme.foreground = cfg.foreground; document.documentElement.style.setProperty("--fg", cfg.foreground); }
    if (cfg.cursor_bg) theme.cursor = cfg.cursor_bg;
    if (cfg.cursor_fg) theme.cursorAccent = cfg.cursor_fg;

    if (cfg.selection_fg) theme.selectionForeground = cfg.selection_fg;
    (cfg.ansi || []).slice(0, 8).forEach((c, i) => { theme[themeName(i)] = c; });
    (cfg.brights || []).slice(0, 8).forEach((c, i) => { theme[themeName(i + 8)] = c; });

    root.setProperty("--mono", term.options.fontFamily);

    if (cfg.font_size && !TOUCH) root.setProperty("--bar-font", Math.max(12, cfg.font_size - 1) + "px");
    const bar = cfg.tab_bar || {};

    const light = /^#fffcf0$/i.test(bar.background || "");

    for (const [name, value] of [["--bar-bg", bar.background], ["--tab-active-bg", bar.active_bg], ["--tab-active-fg", bar.active_fg],

      if (value) root.setProperty(name, value);

    if (edge) document.querySelector('meta[name="theme-color"]').content = edge;

    if (cfg.font_size) { baseFontSize = Math.max(8, cfg.font_size - 1); setFont(baseFontSize); }
    // The size is claimed once the bundled font and the user's fonts this
    // browser already keeps are in; a font still on its way from the Mac
    // measures the terminal again when it lands, once per browser.
    const kept = loadUserFonts(cfg.font_files || []);
    Promise.all([document.fonts.load('16px "Kaku Mono"'), Promise.race([kept, sleep(1500)])]).finally(() => {
      fontReady = true;
      remeasure();
    });
  };
  // xterm.js measures cells only when a font option changes, so once a font
  // is in, nudge the size to measure it instead of the face it saw first;
  // fit() then sets Kaku's size back.
  const remeasure = () => {
    if (!fontReady) return;
    setFont(baseFontSize + 1);
    fit();
  };

  // Fonts the user installed on the Mac that this browser lacks. Kaku sends
  // each file once over the download path; the page keeps it in the
  // browser's cache under its path, size and date, so later visits draw
  // with it at once and an updated file is fetched again.
  const FONT_CACHE = "kaku-fonts";
  const userFaces = new Map();
  const fontKey = (f) => "/kaku-fonts/" + encodeURIComponent(f.path) + "?" + f.size + "-" + f.modified;
  const fontProbe = document.createElement("canvas").getContext("2d");
  // Installed here (or already added) when it changes the width of a
  // sample against either generic family.
  const hasFont = (family) => ["monospace", "serif"].some((generic) => {
    const sample = "mmmmmmmmmmlli1WQ@\u4e2d\uf015";
    fontProbe.font = "32px " + generic;
    const base = fontProbe.measureText(sample).width;
    fontProbe.font = '32px "' + family.replace(/["\\]/g, "") + '", ' + generic;
    return fontProbe.measureText(sample).width !== base;
  });
  const fontCache = async () => { try { return await caches.open(FONT_CACHE); } catch (_) { return null; } };
  const keptFont = async (f) => {
    try { const r = await (await fontCache())?.match(fontKey(f)); return r ? await r.arrayBuffer() : null; } catch (_) { return null; }
  };
  const keepFont = async (f, buf) => {
    try {
      const cache = await fontCache();
      if (!cache) return;
      const same = "/kaku-fonts/" + encodeURIComponent(f.path) + "?";
      for (const req of await cache.keys()) {
        const url = new URL(req.url);
        if (url.pathname + "?" === same && url.pathname + url.search !== fontKey(f)) await cache.delete(req);
      }
      await cache.put(fontKey(f), new Response(buf, { headers: { "Content-Type": "font/sfnt" } }));
    } catch (_) {}
  };
  const addFace = async (f, buf) => {
    const face = new FontFace(f.family, buf);
    await face.load();
    document.fonts.add(face);
  };
  const loadUserFonts = (files) => {
    const waits = [];
    for (const f of files) {
      if (!f || !f.family || !f.path) continue;
      const key = fontKey(f);
      if (userFaces.has(key)) continue;
      if (hasFont(f.family)) { userFaces.set(key, "local"); continue; }
      userFaces.set(key, "loading");
      const failed = () => userFaces.set(key, "failed");
      waits.push(keptFont(f).then((buf) => {
        if (buf) return addFace(f, buf).then(() => userFaces.set(key, "loaded"), failed);
        fetchFromMac(f.path).then(
          (buf) => addFace(f, buf).then(() => { userFaces.set(key, "loaded"); keepFont(f, buf); remeasure(); }, failed),
          // The link dropped mid-file: the next session's config asks again.
          () => userFaces.delete(key));
      }));
    }
    return Promise.all(waits);
  };

  // Inline images (imgcat, kitty, sixel) Kaku shows in the pane: their files
  // arrive once, and each frame that moves them says where they sit, in cells.
  const onImage = (msg) => {
    const bytes = Uint8Array.from(atob(msg.data), (c) => c.charCodeAt(0));
    imageFiles.set(msg.id, URL.createObjectURL(new Blob([bytes], { type: msg.mime })));
    // Keep memory bounded: drop the oldest files nothing places any more.
    for (const [id, url] of imageFiles) {
      if (imageFiles.size <= 64) break;
      if (imagePlacements.some((p) => p.id === id)) continue;
      URL.revokeObjectURL(url);
      imageFiles.delete(id);
    }
  };
  const renderImages = () => {
    if (!imagesEl.isConnected) termEl.append(imagesEl);
    imagesEl.textContent = "";
    const cell = cellSize();
    if (!cell || !size.cols) return;
    imagesEl.style.width = size.cols * cell.width + "px";
    imagesEl.style.height = size.rows * cell.height + "px";
    for (const p of imagePlacements) {
      const url = imageFiles.get(p.id);
      if (!url) continue;
      const img = document.createElement("img");
      img.src = url;
      img.alt = "";
      img.style.left = p.col * cell.width + "px";
      img.style.top = p.row * cell.height + "px";
      img.style.width = p.cols * cell.width + "px";
      img.style.height = p.rows * cell.height + "px";
      imagesEl.append(img);
    }
  };

  const onFrame = (msg) => {
    const socket = ws;
    if (msg.pane_id !== paneId) {
      if (msg.seq) ackFrame(msg.seq);
      return;
    }
    document.body.classList.add("drawn");
    if (msg.cols !== size.cols || msg.rows !== size.rows) {
      closePast();
      size = { cols: msg.cols, rows: msg.rows };
      macSized = !!claimed && claimed !== msg.cols + "x" + msg.rows && !splitView();
      resizeTerm(msg.cols, msg.rows);
      fit();
      clearPending = true;
      verifySoon();
    }
    revealWhenSized();
    localScroll = !!msg.local_scroll;
    if (!localScroll) closePast();
    // Autowrap off first: each row is placed by position, so a row that
    // xterm measures one cell wider than Kaku (a glyph whose width the two
    // disagree on) must overwrite its last cell, not wrap. Wrapping on the
    // last row scrolled the whole screen, and every later frame then drew
    // over a shifted copy: stale rows stayed until a reload.
    const clear = clearPending ? CLEAR : "";
    clearPending = false;
    writeTerm(clear + NO_WRAP + steadyCursor(msg.data), () => {
      if (ws !== socket) return;
      if (msg.pane_id === paneId) {
        if (msg.seq) appliedSeq = msg.seq;
        // Kaku leaves out wrap flags that did not change (hello's delta).
        if (msg.wrapped) liveWrapped = msg.wrapped;
        markFound();
        repairShown();
      }
      if (msg.seq) ackFrame(msg.seq);
    });
    if (msg.images) imagePlacements = msg.images;
    if (msg.images || imagePlacements.length) renderImages();
    serverScrolled = !!msg.scrolled;
    showHistoryButton();
    // A title that already names Kaku (a cwd called kaku) is not repeated.
    if (msg.title === undefined) return;
    const t = msg.title.trim();
    baseTitle = !t ? "Kaku" : /\bkaku\b/i.test(t) ? t : t + " - Kaku";
    renderTitle();
  };

  // A program in the pane copied text (OSC 52). Browsers only let a focused
  // page write the clipboard, so a copy that arrives while it is not focused
  // is written on the next focus or press.
  let pendingCopy = null;
  const copyToClipboard = (text) => {
    if (!navigator.clipboard) return;
    pendingCopy = text;
    navigator.clipboard.writeText(text).then(() => { if (pendingCopy === text) pendingCopy = null; }).catch(() => {});
  };
  const flushCopy = () => { if (pendingCopy !== null) copyToClipboard(pendingCopy); };
  window.addEventListener("focus", flushCopy);
  document.addEventListener("pointerdown", flushCopy, true);

  // Complete a selection locally, with no Mac or relay round-trip. A denied
  // automatic copy must not overwrite the clipboard on an unrelated later tap.
  const historySelection = () => {
    const selection = getSelection();
    if (!pastOpen || !selection?.rangeCount || selection.isCollapsed) return "";
    const range = selection.getRangeAt(0);
    if (!pastEl.contains(range.startContainer) || !pastEl.contains(range.endContainer)) return "";
    const selected = [...pastRendered].filter(([, row]) => range.intersectsNode(row)).sort((a, b) => a[0] - b[0]);
    if (!selected.length) return "";
    const first = selected[0][0], last = selected.at(-1)[0];
    const lines = [];
    for (let id = first; id <= last; id++) {
      const row = pastRendered.get(id);
      if (row && (id === first || id === last)) {
        const part = document.createRange();
        part.selectNodeContents(row);
        if (row.contains(range.startContainer)) part.setStart(range.startContainer, range.startOffset);
        if (row.contains(range.endContainer)) part.setEnd(range.endContainer, range.endOffset);
        lines.push(part.toString());
      } else lines.push((pastRows[id - pastTop] || "").replace(SEQ, ""));
    }
    return lines.map((line, i) => (i && !pastWrapped[first + i - 1 - pastTop] ? "\n" : "") + line).join("");
  };
  // Frames position rows with autowrap off. Their wrap bits, not a full
  // last column, tell a copied soft wrap apart from an explicit newline.
  let columnSelection = false;
  const liveSelection = () => {
    const text = term.getSelection();
    const range = term.getSelectionPosition();
    if (!text || !range || columnSelection || !liveWrapped.some(Boolean)) return text;

      const start = y === range.start.y ? range.start.x : 0;
      const end = y === range.end.y ? range.end.x : term.cols;
      const trim = y === range.end.y || !liveWrapped[y - buf.viewportY];

  let selectionGesture = false;
  let lastAutoCopy = "";

    if (!copyOnSelect) return;

    if (!text || text === lastAutoCopy) return;
    lastAutoCopy = text;
    pendingCopy = null;
    navigator.clipboard?.writeText(text).catch(() => {});
  };
  stage.addEventListener("mousedown", ev => {
    if (ev.button !== 0 || ev.shiftKey && term.hasSelection()) return;

  }, true);

  document.addEventListener("copy", ev => {
    const text = pastOpen ? historySelection() : termEl.contains(ev.target) ? liveSelection() : "";

    ev.preventDefault();
    ev.stopPropagation();

    // An agent's pane title carries its spinner; its topic stays still.

      return;
    }
    if (msg.type === "file_start") {
      file.name = msg.name;
      file.size = msg.size;
    } else if (msg.type === "file_chunk") {
      const bytes = Uint8Array.from(atob(msg.data), (c) => c.charCodeAt(0));
      file.parts.push(bytes);
      file.received += bytes.length;
      send({ type: "download_ack", id: msg.id, received: file.received });
      toast(`Getting ${file.name} ${file.size ? Math.round((file.received / file.size) * 100) : 100}%`, true);
    } else if (msg.type === "file_end") {
      incoming.delete(msg.id);
      const url = URL.createObjectURL(new Blob(file.parts));
      const a = document.createElement("a");
      a.href = url;
      a.download = file.name;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      toast(`Downloaded ${file.name}`);
    } else if (msg.type === "file_error") {
      incoming.delete(msg.id);
      toast(`Not downloaded: ${msg.detail}`);
    }
  };
  let uploadSeq = 0;
  const uploadWaiters = new Map();
  const CHUNK = 16 * 1024;
  const UPLOAD_WINDOW = 512 * 1024;
  // Keep the acknowledged window large for high RTT, but do not fill a slow
  // browser socket with bulk data ahead of keys. This cannot measure bytes
  // already accepted by a proxy or the OS, only the browser's writable queue.
  const uploadWritable = async (socket, cancelled) => {
    const deadline = performance.now() + 30000;
    while (socket.bufferedAmount > CHUNK) {
      if (cancelled() || ws !== socket || socket.readyState !== WebSocket.OPEN || performance.now() >= deadline) return false;
      await sleep(8);
    }
    return !cancelled() && ws === socket && socket.readyState === WebSocket.OPEN;
  };
  const toBase64 = (buf) => {
    let s = "";
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  // Each chunk is acknowledged by the Mac after it is written; the percentage is
  // what reached the Mac. A link that drops mid-file reconnects and sends the
  // file again (the Mac discards the partial one), and a file that still
  // cannot go says so instead of sitting at 0%.
  const uploadAcks = new Map();
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const openSocket = async () => {
    for (let i = 0; i < 150; i++) {
      if (ws && ws.readyState === WebSocket.OPEN && paneId !== null) return ws;
      await sleep(200);
    }
    return null;
  };
  const sendOnce = async (file, name, socket, transfer, target, paste) => {
    const id = ++uploadSeq;
    let finishLost;
    const lost = new Promise(resolve => { finishLost = () => resolve(null); });
    socket.addEventListener("close", finishLost, { once: true });
    const done = new Promise(resolve => uploadWaiters.set(id, resolve));
    let result = null;
    done.then(value => { result = value; });
    let timer;
    const wait = async (promises, ms) => {
      try {
        return await Promise.race([...promises, lost, new Promise(resolve => { timer = setTimeout(() => resolve(null), ms); })]);
      } finally { clearTimeout(timer); }
    };
    try {
      send({ type: "upload_start", id, name, size: file.size, transfer, pane_id: target, paste });
      // Small writes yield between chunks without shrinking the 512 KB
      // acknowledged window. Await encryption so it cannot bypass the socket
      // queue limit; unrelated input keeps its place in the same ordered chain.
      for (let off = 0; off < file.size; off += UPLOAD_WINDOW) {
        const end = Math.min(file.size, off + UPLOAD_WINDOW);
        const acked = new Promise(resolve => uploadAcks.set(id, received => {
          toast(`Sending ${name} ${Math.round((received / file.size) * 100)}%`, true);
          if (received >= end) resolve(received);
        }));
        for (let pos = off; pos < end; pos += CHUNK) {
          if (!await uploadWritable(socket, () => result)) return result;
          const data = toBase64(await file.slice(pos, Math.min(pos + CHUNK, end)).arrayBuffer());
          if (result || ws !== socket || socket.readyState !== WebSocket.OPEN) return result;
          const sent = await wait([Promise.resolve(send({ type: "upload_chunk", id, data })), done], 30000);
          if (sent === null || result || ws !== socket) return result;
        }
        const received = await wait([acked, done], 30000);
        if (result) return result;
        if (received === null || ws !== socket) return null;
      }
      send({ type: "upload_end", id });
      return await wait([done], 60000);
    } finally {
      socket.removeEventListener("close", finishLost);
      uploadWaiters.delete(id);
      uploadAcks.delete(id);
      // Only an attempt that did not finish leaves anything to clean up.
      if (!result && ws === socket && socket.readyState === WebSocket.OPEN) send({ type: "upload_cancel", id });
    }
  };
  // Resolves to where the file landed on the Mac, once it did.
  const sendFile = async (file, name, target = paneId, paste = true) => {
    if (file.size > 50 * 1024 * 1024) { toast(`${name} is larger than 50 MB`); return; }
    const transfer = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    for (let attempt = 0; attempt < 3; attempt++) {
      toast(attempt ? `Reconnecting to send ${name}` : `Sending ${name} 0%`, true);
      const socket = await openSocket();
      if (!socket) break;
      let result;
      try {
        result = await sendOnce(file, name, socket, transfer, target, paste);
      } catch (_) {
        // The file could not be read (moved, or on a share that dropped).
        toast(`${name} was not sent because it could not be read.`);
        return;
      }
      if (result) {
        toast(result.ok ? `Sent to ${result.detail.replace(/^\/Users\/[^/]+/, "~")}` : `Not sent: ${result.detail}`);
        return result.ok ? result.detail : undefined;
      }
    }
    toast(`${name} was not sent because the connection dropped. Try again.`);
  };
  const pastedName = (file) => {
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace("T", "-").slice(0, 15);
    const ext = (file.type.split("/")[1] || "png").replace("jpeg", "jpg");
    return `pasted-${stamp}.${ext}`;
  };
  // Dropped on the Mac's screen, files paste no path into a pane; Finder
  // shows them once they all arrived.
  const sendFiles = async (files, pasted, onDesktop = false) => {
    const target = paneId;
    const landed = [];
    for (const f of files) {
      const path = await sendFile(f, pasted ? pastedName(f) : f.name, target, !onDesktop);
      if (path) landed.push(path);
    }
    if (!onDesktop) refocus();
    else if (landed.length && desktop?.active) send({ type: "desktop_reveal", paths: landed });
  };
  stage.addEventListener("dragover", (ev) => {
    if (![...(ev.dataTransfer?.types || [])].includes("Files")) return;
    ev.preventDefault();
    document.body.classList.add("dropping");
  });
  stage.addEventListener("dragleave", () => document.body.classList.remove("dropping"));
  stage.addEventListener("drop", (ev) => {
    document.body.classList.remove("dropping");
    const files = [...(ev.dataTransfer?.files || [])];
    if (!files.length) return;
    ev.preventDefault();
    sendFiles(files, false, !!desktop?.active);
  });

  const handle = (msg) => {
    if (msg.type === "error") toast(msg.detail);
    else if (msg.type === "config") onConfig(msg);
    else if (msg.type === "verify_rows") verify(true, true);
    else if (msg.type === "tabs") onTabs(msg.tabs);
    else if (msg.type === "frame") { framesSeen++; onFrame(fillFrame(msg)); }
    else if (msg.type === "clipboard") copyToClipboard(msg.text);
    else if (msg.type === "notify") onNotify(msg);
    else if (msg.type === "image") onImage(msg);
    else if (msg.type === "found") onFound(msg);
    else if (msg.type === "history") onHistory(msg);
    else if (msg.type.startsWith("file_")) onFile(msg);
    else if (msg.type === "paths_exist") pathQuestions.get(msg.id)?.(msg.exists);
    else if (msg.type.startsWith("desktop_")) desktop?.handle(msg);
    else if (msg.type === "upload_ack") { const a = uploadAcks.get(msg.id); if (a) a(msg.received); }
    else if (msg.type === "uploaded") { const w = uploadWaiters.get(msg.id); if (w) { uploadWaiters.delete(msg.id); w(msg); } }
    else if (msg.type === "closed") {
      // A tabs update may already have moved the page to another tab; the
      // late notice for the old pane must not drop the tab it moved to.
      if (msg.pane_id !== paneId) return;
      const gone = paneId;
      snapshots.delete(gone);
      tabId = null;
      paneId = null;
      onTabs(authoritativeTabs.filter((t) => t.pane_id !== gone));
    }
  };

  // Heartbeat: a link that died without closing (sleep, a network switch, a
  // proxy's idle timeout) shows up as an unanswered ping; reconnect instead
  // of waiting. Judge by the ping, not by time since the last message:
  // background tabs run timers about once a minute, and measuring silence
  // across that gap closed a healthy link every minute.
  let lastHeard = Date.now();
  let pingSentAt = 0;
  const PONG_WAIT = 15000;
  setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN || pendingPair) return;
    if (pingSentAt > lastHeard && Date.now() - pingSentAt > PONG_WAIT) { ws.close(); return; }
    if (pingSentAt > lastHeard) return;
    pingSentAt = Date.now();
    send({ type: "ping" });
  }, 20000);

  // Through the relay the Mac's status (or, when the relay served this page,
  // the page's own address) answers 404 while the Mac's Kaku is not
  // connected, and fails outright without a network.
  const explainOffline = () => {
    if (!relay) {
      setNotice("Kaku is not running", "Open Kaku on the Mac.", { stale: true, brand: true });
      return;
    }
    const asked = RELAY
      ? fetch(RELAY.replace(/^ws/, "http") + "/" + hostId + "/status", { cache: "no-store" })
      : fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    asked.then((res) => {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      if (res.status === 404) setNotice("Kaku on the Mac is offline", "Open Kaku on the Mac, or run kaku doctor there.", { stale: true, brand: true });
    }).catch(() => {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      setNotice("No connection", "Check this device's network.", { stale: true });
    });
  };
  // A page left open across a Kaku update or a new page release keeps
  // running its old script. After a reconnect, compare that script with the
  // one this address serves now and reload into the new one, once per
  // version so a stale cache cannot loop, and never mid-upload.
  const PAGE_SCRIPT = document.querySelector("script:not([src])")?.textContent || "";
  const checkPageFresh = () => {
    fetch(location.pathname, { cache: "no-store" })
      .then((res) => (res.ok ? res.text() : ""))
      .then((html) => {
        const served = /<script>([\s\S]*?)<\/script>/.exec(html)?.[1];
        if (!served || served === PAGE_SCRIPT || uploadAcks.size) return;
        let sum = 0;
        for (let i = 0; i < served.length; i++) sum = (sum * 31 + served.charCodeAt(i)) | 0;
        const version = served.length + "." + sum;
        try {
          if (sessionStorage.getItem("kaku.reloaded") === version) return;
          sessionStorage.setItem("kaku.reloaded", version);
        } catch (_) { return; }
        location.reload();
      })
      .catch(() => {});
  };
  // ── Direct path ──
  // Beside the relay, a WebRTC data channel straight to the Mac, offered
  // once Kaku says it answers one (`direct`, or `desktop` from the private
  // builds that had it first). The offer and answer go through
  // the sealed session, so the DTLS fingerprints in them are the Mac's and
  // this page's own. Once open, small messages and everything Kaku sends
  // interactively take it; files stay on the relay. `?p2p` tries it on a
  // local link too. Kaku's messages come in pieces: a flag byte (1 last,
  // 2 text), then up to 16 KB.
  //
  // Order across the move: each side's last word on the relay before it
  // sends on the path is `rtc_ready`, one per lane from Kaku (text, frames),
  // and what arrives on the path waits for it, so a key or a picture never
  // overtakes one still on its way through the relay. Either side ending
  // the path tells the other by the relay (`rtc_closed`, `rtc_close`); what
  // was lost on it comes back as a full screen and a key frame.
  const DIRECT_PIECE = 16 * 1024;
  const DIRECT_FORCED = new URLSearchParams(location.search).has("p2p");
  // After a path that worked ends (a network change), offer again after
  // these waits; a path held a minute starts the count over. One that never
  // opened is not retried: the networks between do not let it through.
  const DIRECT_RETRY_S = [2, 5, 15, 30, 60];
  let direct = null;
  let directRetries = 0;
  let directRetryTimer = 0;
  const closeDirect = () => {
    const path = direct;
    direct = null;
    if (!path) return;
    try { path.dc.close(); path.pc.close(); } catch (_) {}
  };
  const directLost = (path, tellMac) => {
    if (direct !== path) return;
    closeDirect();
    if (ws !== path.socket) return;
    if (tellMac && path.id !== null) send({ type: "rtc_close", id: path.id });
    if (!path.open) return;
    // Pieces still on the path are gone: start the screen over.
    sayHello();
    if (paneId !== null) send({ type: "attach", pane_id: paneId });
    desktop?.resync?.();
    if (performance.now() - path.openedAt > 60000) directRetries = 0;
    if (directRetries >= DIRECT_RETRY_S.length) return;
    clearTimeout(directRetryTimer);
    directRetryTimer = setTimeout(() => {
      if (ws === path.socket) openDirect(path.socket, path.deliver);
    }, DIRECT_RETRY_S[directRetries++] * 1000);
  };
  const gathered = (pc, ms) => new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") { resolve(); return; }
    const timer = setTimeout(resolve, ms);
    pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") { clearTimeout(timer); resolve(); }
    });
  });
  const openDirect = async (socket, deliver) => {
    if (direct || typeof RTCPeerConnection !== "function") return;
    let pc;
    try { pc = new RTCPeerConnection({ iceServers: [{ urls: ["stun:stun.cloudflare.com:3478", "stun:stun.l.google.com:19302", "stun:stun.miwifi.com:3478"] }] }); } catch (_) { return; }
    const dc = pc.createDataChannel("kaku");
    dc.binaryType = "arraybuffer";
    const path = {
      pc, dc, socket, deliver, id: null, open: false, paused: false, parts: [], since: performance.now(),
      // Kaku's lanes that have said `rtc_ready`, and what came before.
      ready: { text: false, frames: false }, held: [],
    };
    direct = path;
    dc.onopen = () => {
      if (direct !== path) return;
      // The last of this page's messages by the relay; a Kaku that numbers
      // no paths takes the path's messages at once.
      if (path.id !== null) send({ type: "rtc_ready", id: path.id });
      path.open = true;
      path.openedAt = performance.now();
      path.openedIn = Math.round(path.openedAt - path.since);
    };
    dc.onclose = () => directLost(path, true);
    // A path that stops answering is left to the relay until it answers
    // again; one the browser gives up on is closed.
    pc.oniceconnectionstatechange = () => {
      const state = pc.iceConnectionState;
      if (state === "disconnected") path.paused = true;
      else if (state === "connected" || state === "completed") path.paused = false;
      else if (state === "failed" || state === "closed") directLost(path, true);
    };
    dc.onmessage = (ev) => {
      if (direct !== path || ws !== socket) return;
      const bytes = new Uint8Array(ev.data);
      path.parts.push(bytes.subarray(1));
      if (!(bytes[0] & 1)) return;
      const size = path.parts.reduce((n, part) => n + part.length, 0);
      const whole = new Uint8Array(size);
      let at = 0;
      for (const part of path.parts) { whole.set(part, at); at += part.length; }
      path.parts = [];
      let msg;
      try { msg = bytes[0] & 2 ? JSON.parse(dec.decode(whole)) : unpackFrame(whole); } catch (_) { return; }
      const lane = bytes[0] & 2 ? "text" : "frames";
      if (!path.ready[lane]) { path.held.push([lane, msg]); return; }
      // After whatever the relay delivered first.
      recvChain = recvChain.then(() => deliver(msg));
    };
    try {
      await pc.setLocalDescription(await pc.createOffer());
      await gathered(pc, 2000);
    } catch (_) { if (direct === path) closeDirect(); return; }
    if (direct !== path || ws !== socket) return;
    send({ type: "rtc_offer", sdp: pc.localDescription.sdp });
  };
  const answered = (socket, msg) => {
    const path = direct;
    if (!path || path.socket !== socket || typeof msg.sdp !== "string") return;
    if (Number.isSafeInteger(msg.id)) path.id = msg.id;
    else path.ready = { text: true, frames: true };
    path.pc.setRemoteDescription({ type: "answer", sdp: msg.sdp }).catch(() => { if (direct === path) closeDirect(); });
  };
  // Kaku's lane moved to the path: what it sent there so far comes next.
  const laneReady = (socket, msg) => {
    const path = direct;
    if (!path || path.socket !== socket || path.id !== msg.id || !(msg.lane in path.ready)) return;
    path.ready[msg.lane] = true;
    const held = path.held;
    path.held = [];
    for (const [lane, m] of held) {
      if (lane === msg.lane) path.deliver(m);
      else path.held.push([lane, m]);
    }
  };
  const directClosed = (socket, msg) => {
    const path = direct;
    if (path && path.socket === socket && path.id === msg.id) directLost(path, false);
  };

  let reconnectTimer = 0;
  let linkRejected = false;
  // Bare 4403 closes in a row, without the Mac's sealed `revoked`.
  let refusals = 0;
  let handshakeTimer = 0;
  const connect = () => {
    clearTimeout(reconnectTimer);
    clearTimeout(handshakeTimer);
    if (linkRejected) return;
    if (!everConnected) setNotice("Connecting to Kaku", "", { delay: 400 });
    const socket = new WebSocket(wsUrl());
    let checkedPage = false;
    socket.binaryType = "arraybuffer";
    ws = socket;
    handshakeTimer = setTimeout(() => { if (ws === socket) socket.close(); }, 20000);
    lastHeard = Date.now();
    pingSentAt = 0;
    framesSeen = 0;
    appliedSeq = 0;
    resetFrames();
    link = newLink();
    sendChain = relay ? link.promise : Promise.resolve();
    recvChain = Promise.resolve();
    socket.onopen = () => {
      // A WebSocket upgrade is not an authenticated Kaku session. Through
      // the relay these wait for the challenge, and Kaku starts the session
      // once the first of them opens with the key.
      sayHello();
      // Re-attach after a reconnect; the server keeps no per-browser state.
      if (paneId !== null) send({ type: "attach", pane_id: paneId });
    };
    socket.onmessage = (ev) => {
      if (ws !== socket) return;
      receive(socket, ev.data, (msg) => onMessage(socket, msg));
    };
    const onMessage = (socket, msg) => {
      if (ws !== socket) return;
      if (msg.type === "pair_pending" && pairing) {
        pendingPair = true;
        clearTimeout(handshakeTimer);
        pairingCode().then((code) => {
          if (ws === socket && pendingPair) setNotice("Confirm " + code + " on your Mac", "Press Enter where you ran kaku remote if it shows the same code.");
        });
        return;
      }
      // Sealed by the Mac, so unlike a bare close code nobody on the way
      // can send it: this browser was removed, forget its key.
      if (msg.type === "revoked") { socket.revoked = true; forgetDevice(); return; }
      if (msg.type === "rtc_answer") { answered(socket, msg); return; }
      if (msg.type === "rtc_ready") { laneReady(socket, msg); return; }
      if (msg.type === "rtc_closed") { directClosed(socket, msg); return; }
      if (msg.type === "config" && (msg.direct || msg.desktop) && (relay || DIRECT_FORCED)) openDirect(socket, (m) => onMessage(socket, m));
      lastHeard = Date.now();
      if (msg.type === "config" || msg.type === "tabs" || msg.type === "frame" || msg.type === "pong") {
        clearTimeout(handshakeTimer);
        retry = 0;
        refusals = 0;
        pendingPair = false;
        if (everConnected && !checkedPage) {
          checkedPage = true;
          checkPageFresh();
        }
        everConnected = true;
        clearNotice();
        finishPairing();
      }
      handle(msg);
    };
    socket.onclose = (ev) => {
      if (ws !== socket) return;
      closeDirect();
      clearTimeout(directRetryTimer);
      directRetries = 0;
      hideImagePreview();
      clearTimeout(handshakeTimer);
      stopScrolling();
      closePast();
      const wasPending = pendingPair;
      pendingPair = false;
      if (!relay && (ev.code === 4403 || ev.code === 1008)) {
        linkRejected = true;
        setNotice("This link no longer works", "Run kaku remote on the Mac for the new one.", { stale: true });
        return;
      }
      // Only the Mac's sealed note removes this browser; a bare close code
      // (a relay, or a message that did not open) is retried a few times.
      if (socket.revoked || ((ev.code === 4403 || ev.code === 1008) && ++refusals >= 3)) {
        linkRejected = true;
        setNotice(socket.revoked ? "This browser is not paired" : "Kaku refused this browser", "Run kaku remote on the Mac to pair again.", { stale: true });
        return;
      }
      if (ev.code === 4409) {
        linkRejected = true;
        setNotice("Not confirmed on the Mac", "Run kaku remote on the Mac for a new link.", { stale: true });
        return;
      }
      if (ev.code === 4429) {
        linkRejected = true;
        setNotice("Another browser opened this link first", "Do not confirm it on the Mac. Run kaku remote there for a new link.", { stale: true });
        return;
      }
      // Still waiting for Enter: reconnect at once and wait again.
      if (wasPending) retry = 0;
      if (ev.code === 4401) {
        linkRejected = true;
        setNotice("This pairing link has expired", "Run kaku remote on the Mac for a new one.", { stale: true });
        return;
      }
      if (ev.code === 4426) {
        linkRejected = true;
        setNotice("Kaku on the Mac was updated", "Reload this page to use the new version.", { stale: true });
        return;
      }
      // Kaku drops a download with its session; ask for the file again.
      // A font is asked for again by the next session's config.
      if (incoming.size) {
        const files = [...incoming.values()];
        incoming.clear();
        files.forEach((file) => file.font?.reject(new Error("connection dropped")));
        if (files.some((file) => !file.font)) toast("Download stopped because the connection dropped. Cmd+click the path again.");
      }
      // A quick blip reconnects before anyone notices; say something only if
      // it lasts, and after a few failures say why when the page can tell.
      claimed = "";
      // Offline, retrying cannot work; the online event reconnects at once.
      if (navigator.onLine === false) {
        setNotice("No connection", "Check this device's network.", { stale: true });
        return;
      }
      setNotice("Reconnecting", "", { stale: true, delay: retry ? 0 : 800 });
      if (retry >= 2) explainOffline();
      const delay = Math.min(5000, 500 * 2 ** retry++);
      reconnectTimer = setTimeout(connect, delay);
    };
  };
  connect();

  // Back online: reconnect now instead of waiting out the backoff.
  window.addEventListener("online", () => {
    if (linkRejected) return;
    if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
      retry = 0;
      connect();
    }
  });

  // Phones suspend a page in the background and its socket often dies
  // there. On return, reconnect at once, or check the link with a ping
  // instead of waiting out the heartbeat.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || linkRejected) return;
    reclaim();
    verifySoon();
    if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
      retry = 0;
      connect();
      return;
    }
    if (ws.readyState !== WebSocket.OPEN || pendingPair) return;
    const socket = ws;
    pingSentAt = Date.now();
    send({ type: "ping" });
    setTimeout(() => {
      if (ws === socket && pingSentAt > lastHeard) socket.close();
    }, 3000);
  });
  // A signature that does not match the paired Mac: someone in between, or
  // the Mac was reset. Stop rather than retry.
  notThisMac = (socket) => {
    linkRejected = true;
    if (ws === socket) socket.close();
    setNotice("Could not verify the Mac", "Run kaku remote on the Mac to pair again.", { stale: true });
  };
  linkExpired = (socket) => {
    linkRejected = true;
    if (ws === socket) socket.close();
    setNotice("This pairing link has expired", "Run kaku remote on the Mac for a new one.", { stale: true });
  };
})();
</script>
