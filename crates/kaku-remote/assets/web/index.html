<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<!-- The relay this page talks to when it is served from its own origin
     (t.kaku.fun, filled in by scripts/publish_web_page.sh). Empty, the page
     reaches the relay or Kaku that served it. -->
<meta name="kaku-relay" content="">
<title>Kaku</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon-maskable.png">
<!-- Installs as its own app: the manifest's start_url and scope are relative
     to it, so each Mac's page (t.kaku.fun/<id>/) installs separately. -->
<link rel="manifest" href="assets/manifest.webmanifest">
<meta name="theme-color" content="#16161a">
<link rel="stylesheet" href="assets/xterm.css">
<style>
  @font-face { font-family: "Kaku Mono"; src: url("assets/font-regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Kaku Mono"; src: url("assets/font-medium.woff2") format("woff2"); font-weight: 700; }
  /* Kaku's bundled Symbols Nerd Font, for the icons prompts and file
     listers print. Limited to its private-use spans, the browser fetches it
     only once such an icon is on screen. */
  @font-face { font-family: "Kaku Symbols"; src: url("assets/font-symbols.woff2") format("woff2"); unicode-range: U+E000-F533, U+F0001-F1AF0; }
  :root { --bg: #16161a; --fg: #d4d4d8; --muted: #8b8b93; --line: rgba(255,255,255,0.08); }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  /* The tab bar follows Kaku's own: monospace titles, the active tab as a
     filled block in Kaku's tab colors, no rule between it and the terminal. */
  :root { --mono: "Kaku Mono", monospace; --bar-bg: var(--bg); --tab-fg: var(--muted); --tab-active-bg: rgba(255,255,255,0.08); --tab-active-fg: var(--fg); --tab-hover-bg: rgba(255,255,255,0.05); --tab-hover-fg: var(--fg); }
  /* A phone (touch and narrow, or on its side) lists tabs in a drawer and
     types through a compose box; tablets and desktops keep the tab bar. The
     bar keeps the touch heights below, slimmer on a phone on its side. */
  #mobile-switch, #mobile-tabs, #mobile-shade, #compose { display: none; }
  body.phone #bar #tabs { display: none; }
  body.phone #bar #mobile-switch { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; max-width: none; padding: 0 12px; color: var(--tab-active-fg); text-align: left; }
  #mobile-switch .icon { position: relative; flex: none; display: flex; }
  #mobile-switch svg { width: 16px; height: 16px; color: var(--tab-fg); }
  #mobile-switch .mobile-dot { position: absolute; top: -2px; right: -3px; display: none; }
  #mobile-switch.waiting .mobile-dot { display: block; }
  #mobile-switch .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .mobile-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--dot, #daae76); }
  body.phone #mobile-shade.show { display: block; position: fixed; inset: 0; z-index: 17; background: rgba(0,0,0,0.4); }
  body.phone #mobile-tabs { display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 18; box-sizing: border-box; width: min(85vw, 340px); padding-top: env(safe-area-inset-top); background: var(--bg); border-right: 1px solid var(--line); font: 14px var(--mono); transform: translateX(-100%); visibility: hidden; transition: transform 0.2s ease-out, visibility 0s 0.2s; }
  body.phone #mobile-tabs.show { transform: none; visibility: visible; transition: transform 0.2s ease-out; }
  #mobile-head { flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; color: var(--muted); font-size: 13px; }
  #mobile-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .mobile-row { display: flex; align-items: center; }
  .mobile-row.current { background: var(--tab-active-bg); }
  .mobile-row button { border: 0; background: transparent; color: var(--fg); font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mobile-select { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 56px; padding: 8px 4px 8px 16px; text-align: left; }
  .mobile-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mobile-label, .mobile-sub span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mobile-sub { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: 12px; }
  .mobile-sub svg { flex: none; width: 12px; height: 12px; }
  .mobile-row input { flex: 1; min-width: 0; margin: 8px 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: 16px var(--mono); outline: none; }
  .mobile-more { flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: var(--muted) !important; }
  .mobile-more svg { width: 16px; height: 16px; }
  #mobile-foot { flex: none; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  #mobile-new { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  body.phone #compose { display: flex; order: 4; flex: none; align-items: flex-end; gap: 8px; padding: 6px 8px; border-top: 1px solid var(--line); }
  #compose textarea { flex: 1; min-width: 0; box-sizing: border-box; height: 38px; max-height: 128px; margin: 0; padding: 8px 10px; resize: none; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: 16px/20px var(--mono); outline: none; }
  #compose button { flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 38px; border: 0; border-radius: 8px; background: var(--line); color: var(--fg); -webkit-user-select: none; user-select: none; }
  #compose button svg { width: 16px; height: 16px; }
  /* The bottom of a phone is for typing only: the tab bar stays on top
     whatever tab_bar_at_bottom says, and the key row shows only while the
     keyboard is up or the box has focus. */
  body.phone.tabs-bottom #bar { order: 0; }
  body.phone:not(.kb):not(.composing) #keys { display: none; }
  #image-preview { box-sizing: border-box; position: fixed; z-index: 30; pointer-events: none; max-width: min(640px, calc(100vw - 24px)); max-height: min(480px, calc(100vh - 24px)); object-fit: contain; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px #0004; }
  body.tabs-bottom #bar { order: 2; }
  #bar { display: flex; align-items: stretch; height: var(--bar-h, 32px); padding: 0; background: var(--bar-bg); flex: none; font: var(--bar-font, 15px) var(--mono); }
  /* Tabs scroll sideways when they do not fit; a fade at either end says
     there are more that way. */
  #tabs { display: flex; align-items: stretch; flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs.more-left { -webkit-mask-image: linear-gradient(to right, transparent, #000 32px); mask-image: linear-gradient(to right, transparent, #000 32px); }
  #tabs.more-right { -webkit-mask-image: linear-gradient(to left, transparent, #000 32px); mask-image: linear-gradient(to left, transparent, #000 32px); }
  #tabs.more-left.more-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); }
  #tools { display: flex; align-items: stretch; flex: none; margin-left: auto; }
  #bar button { flex: none; max-width: 240px; height: auto; padding: 0 12px; border: 0; border-radius: 0; background: transparent; color: var(--tab-fg); font: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; outline: none; }
  #bar button:hover { background: var(--tab-hover-bg); color: var(--tab-hover-fg); }
  #bar button[aria-current="true"] { background: var(--tab-active-bg); color: var(--tab-active-fg); }
  #bar button:focus-visible { box-shadow: inset 0 0 0 1px var(--tab-fg); }
  /* Even padding on both sides; the right padding holds the attention dot,
     or the close mark while the pointer is over the tab, as Kaku's own tab
     bar uses its trailing cell. The mark never covers the title, never sits
     on the edge, and the dot leaving does not resize the tab. */
  #bar .tab { position: relative; display: flex; align-items: center; padding: 0 var(--tab-pad, 14px); }
  #bar .tab span:first-child { overflow: hidden; text-overflow: ellipsis; }
  #bar .slot { position: absolute; top: 0; right: 0; bottom: 0; width: var(--tab-pad, 14px); }
  #bar .dot, #bar .close { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity 0.15s; }
  #bar .dot::after { content: ""; width: 0.3em; height: 0.3em; border-radius: 50%; background: var(--dot, #daae76); }
  #bar .dot.in { animation: dot-in 0.25s ease-out; }
  #bar .dot.out { animation: dot-out 0.3s ease-in forwards; }
  @keyframes dot-in { from { opacity: 0; transform: scale(0.4); } }
  @keyframes dot-out { to { opacity: 0; transform: scale(0.4); } }
  /* Drawn, not a font glyph: a glyph sits on the text baseline and reads
     off-center; the icon is centered in its box exactly. */
  #bar .close { inset: 50% auto auto 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 3px; opacity: 0; pointer-events: none; }
  #bar .close svg { width: 8px; height: 8px; }
  #bar .tab:hover .dot { opacity: 0; }
  #bar .tab:hover .close { opacity: 0.7; pointer-events: auto; }
  #bar .close:hover { opacity: 1; background: var(--tab-hover-bg); }
  #bar .add { width: 38px; padding: 0; font-size: 1.25em; line-height: 1; }
  #bar .tab.drop-before { box-shadow: inset 2px 0 0 var(--tab-active-fg); }
  #bar .tab.drop-after { box-shadow: inset -2px 0 0 var(--tab-active-fg); }
  #bar .tab input { width: 12ch; min-width: 4ch; padding: 0; border: 0; outline: none; background: transparent; color: var(--tab-active-fg); font: inherit; }
  /* Right side: the split map and full screen, one size and one icon
     weight, like the + button. */
  #bar .tool { display: flex; align-items: center; justify-content: center; width: 38px; padding: 0; }
  #bar .tool svg { width: 14px; height: 14px; }
  /* In full screen the system clock is hidden; Kaku shows the time at the
     right end of its tab bar there, and so does the page. */
  #bar .clock { display: none; align-items: center; padding: 0 10px; color: var(--tab-fg); white-space: nowrap; }
  body.fullscreen #bar .clock { display: flex; }
  /* The agent working in this tab, as Kaku shows it at the window's top
     right: its mark and topic, quieter than the tabs. */
  #bar .agent { display: none; align-items: center; gap: 6px; min-width: 0; max-width: 40vw; padding: 0 10px; color: var(--tab-fg); opacity: 0.8; white-space: nowrap; }
  #bar .agent.on { display: flex; }
  #bar .agent svg { flex: none; width: 13px; height: 13px; }
  #bar .agent span { overflow: hidden; text-overflow: ellipsis; }
  #tools { min-width: 0; }
  @media (max-width: 640px) { #bar .agent.on { display: none; } }
  #bar .panes { width: auto; padding: 0 10px; cursor: default; }
  #bar .panes:hover { background: transparent; }
  .map { position: relative; width: 26px; height: 16px; }
  .map button { position: absolute; padding: 0 !important; border: 1px solid var(--tab-fg) !important; border-radius: 2px !important; background: transparent; opacity: 0.6; cursor: pointer; box-sizing: border-box; }
  .map button:hover { opacity: 1; background: transparent !important; }
  .map button[aria-current="true"] { background: var(--tab-fg) !important; opacity: 1; }
  /* Menus and panels share the find bar's look. */
  #viewer { position: fixed; inset: 0; z-index: 40; display: none; overflow: hidden; background: rgba(0,0,0,0.85); background: color-mix(in srgb, var(--bg) 92%, transparent); touch-action: none; opacity: 0; transition: opacity 0.25s ease-out; }
  #viewer.show { display: block; }
  #viewer.in { opacity: 1; }
  #viewer img { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
  #viewer.zoomed img { cursor: grab; }
  #viewer:not(.ready) img { visibility: hidden; }
  #viewer .wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  #viewer .wait[hidden] { display: none; }
  #menu { position: fixed; display: none; min-width: 150px; padding: 4px; border-radius: 8px; background: var(--bar-bg); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,0.25); z-index: 20; }
  #menu.show { display: block; }
  #menu { max-height: calc(100% - 16px); overflow-y: auto; }
  #menu button { display: block; width: 100%; height: 28px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: left; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: var(--tab-hover-bg); outline: none; }
  #menu hr { height: 1px; margin: 4px 6px; border: 0; background: var(--line); }
  body.touch #menu { min-width: 200px; padding: 6px; border-radius: 12px; }
  body.touch #menu button { height: 44px; padding: 0 14px; border-radius: 8px; font-size: 16px; }
  #help .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow-y: auto; }
  #help dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 12px 0 0; font-size: 13px; }
  #help dt { color: var(--fg); font-family: var(--mono); white-space: nowrap; }
  #help dd { margin: 0; color: var(--muted); }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  /* Chrome squeezes runs of CJK punctuation by default. xterm.js measures a
     glyph as 32 copies in a row, so it read "，" as half width while rows draw
     it full width, then padded it with extra letter-spacing: a wide gap after
     every Chinese punctuation mark. Keep punctuation at its full width in
     both places. */
  .xterm, .xterm * { text-spacing-trim: space-all; }
  /* Hidden until Kaku's first frame, so xterm's default black canvas never
     shows before the theme and the screen arrive. */
  #term { position: absolute; top: 8px; left: 8px; visibility: hidden; }
  body.drawn #term { visibility: visible; }
  /* Drawn but not yet at its own grid: kept focusable, just not seen. */
  body.sizing #term { opacity: 0; }
  /* Find bar and toast share the tab bar's look. */
  #find { position: absolute; top: 10px; right: 16px; display: none; align-items: center; gap: 2px; height: 32px; padding: 0 4px 0 10px; border-radius: 8px; background: var(--bar-bg); border: 1px solid var(--line); z-index: 5; }
  #find.show { display: flex; }
  #find input { width: 200px; border: 0; outline: none; background: transparent; color: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #find .count { color: var(--muted); font-size: 12px; padding: 0 6px; white-space: nowrap; }
  #find button { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; }
  #find button:hover { background: var(--tab-hover-bg); color: var(--fg); }
  #find svg { width: 10px; height: 10px; }
  #toast.action { cursor: pointer; pointer-events: auto; }
  #toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; max-width: calc(100% - 32px); padding: 7px 12px; border-radius: 8px; background: var(--bar-bg); border: 1px solid var(--line); color: var(--fg); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 5; }
  #toast.show { display: block; }
  body.dropping #stage { box-shadow: inset 0 0 0 2px var(--muted); }
  #history { position: absolute; right: 16px; bottom: 16px; z-index: 2; display: none; height: 28px; padding: 0 12px; border: 0; border-radius: 14px; background: var(--tab-active-bg); color: var(--tab-active-fg); font: inherit; cursor: pointer; }
  #message { color: var(--muted); padding: 24px; text-align: center; line-height: 1.6; }
  #message img, #notice .logo { width: 56px; height: 56px; margin-bottom: 8px; }
  #message img { display: block; margin: 15vh auto 8px; }
  /* Connection state, over the terminal: dimmed while the screen is stale. */
  #notice { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; pointer-events: none; }
  #notice.show { display: flex; }
  #notice .title { color: var(--fg); font-size: 15px; }
  #notice .detail { color: var(--muted); font-size: 13px; }
  #notice .detail:empty { display: none; }
  #notice .logo { display: none; }
  #notice.brand .logo { display: block; }
  #notice .trust { display: none; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; }
  /* One line under the title: the detail when there is one, otherwise
     the encryption note. */
  #notice.brand:not(.has-detail) .trust.on { display: flex; }
  #notice .trust svg { width: 11px; height: 11px; }
  #term { transition: opacity 0.2s; }
  /* History, scrolled here rather than on the Mac, so it follows the finger
     or the wheel with no round trip. It sits exactly over the terminal and
     draws rows the way it does: each run placed at Kaku's column. */
  #images { position: absolute; left: 0; top: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  #images img { position: absolute; image-rendering: auto; }
  #past { position: absolute; top: 8px; left: 8px; display: none; overflow: hidden; background: var(--bg); color: var(--fg); white-space: pre; cursor: text; z-index: 1; -webkit-user-select: text; user-select: text; }
  #past.show { display: block; }
  #past .row { position: relative; }
  #past .run { position: absolute; top: 0; }
  #past .u { text-decoration: underline; }
  #past .s { text-decoration: line-through; }
  #past .us { text-decoration: underline line-through; }
  #past .i { font-style: italic; }
  body.stale #term { opacity: 0.3; }
  /* In-page confirmation instead of the browser's own dialog. */
  /* Close confirmation drawn like Kaku's own: it takes over the terminal
     area, a rounded box in the terminal font, text buttons that invert on
     hover or focus. */
  /* Close confirmation: one bar at the bottom, the terminal stays in view.
     The layer covers the stage, so a click anywhere else cancels. */
  /* The close confirmation sits by the tab or pane it asks about, its tip
     pointing there: one hairline, a fill a step above the page, no scrim. */
  :root { --hair: 1px; --pop-bg: #26252c; --pop-bg: color-mix(in srgb, var(--bg) 90%, white); --pop-line: rgba(255,255,255,0.14); --pop-line: color-mix(in srgb, var(--fg) 16%, transparent); }
  @media (min-resolution: 2dppx) { :root { --hair: 0.5px; } }
  #dialog { position: fixed; inset: 0; display: none; box-sizing: border-box; z-index: 25; outline: none; }
  #dialog.show { display: block; }
  #dialog .card { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 14px; box-sizing: border-box; max-width: calc(100vw - 16px); padding: 8px 8px 8px 14px; border: var(--hair) solid var(--pop-line); border-radius: 10px; background: var(--pop-bg); box-shadow: 0 8px 16px rgba(0,0,0,0.18); color: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0; transition: opacity 0.25s ease-out; }
  #dialog.in .card { opacity: 1; }
  #dialog .tip { position: absolute; left: 0; width: 16px; height: 8px; overflow: visible; pointer-events: none; }
  #dialog .tip .cover { fill: var(--pop-bg); }
  #dialog .tip .edge { fill: none; stroke: var(--pop-line); stroke-width: var(--hair); }
  #dialog .card.below .tip { top: -7px; margin-top: calc(-1 * var(--hair)); }
  #dialog .card.above .tip { bottom: -7px; margin-bottom: calc(-1 * var(--hair)); transform: rotate(180deg); }
  #dialog .card:not(.below):not(.above) .tip { display: none; }
  #dialog .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dialog .actions { display: flex; gap: 8px; flex: none; }
  #dialog button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.08); background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--fg); font: inherit; cursor: pointer; }
  #dialog button[data-act="ok"] { background: var(--fg); color: var(--bg); }
  #dialog button:hover, #dialog button:focus-visible { opacity: 0.85; outline: none; }
  body.touch #dialog button { height: 34px; padding: 0 16px; }
  #help { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); z-index: 10; }
  #help.show { display: flex; }
  #help .card { padding: 16px; border-radius: 10px; background: var(--bar-bg); border: 1px solid var(--line); }
  #help .title { font-size: 14px; color: var(--fg); }
  /* Phones and tablets: a key row for what touch keyboards lack, finger-size
     targets, room for the home indicator, and a 16px input so iOS does not
     zoom the page when the keyboard opens. */
  #keys { display: none; }
  body.touch { box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom); }
  body.touch #bar { height: 44px; }
  body.touch #bar { --tab-pad: 24px; }
  body.touch #bar .close { width: 20px; height: 20px; margin: -10px 0 0 -11px; }
  body.touch #bar .close svg { width: 10px; height: 10px; }
  body.touch #bar .tab[aria-current="true"] .dot { opacity: 0; }
  body.touch #bar .tab[aria-current="true"] .close { opacity: 0.7; pointer-events: auto; }
  body.touch #bar .add { width: 36px; }
  body.touch #keys { display: flex; order: 3; flex: none; gap: 6px; padding: 6px 8px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line); }
  body.touch #keys::-webkit-scrollbar { display: none; }
  body.touch #keys.more-right { -webkit-mask-image: linear-gradient(to left, transparent, #000 40px); mask-image: linear-gradient(to left, transparent, #000 40px); }
  body.touch #keys button { flex: none; min-width: 40px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: var(--line); color: var(--fg); font: inherit; -webkit-user-select: none; user-select: none; }
  body.touch #keys button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  body.touch .xterm-helper-textarea { font-size: 16px !important; }
  /* A phone on its side has little height: slimmer bars, and the key row
     only while the keyboard is up. */
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch #bar { height: 34px; }
    body.touch #keys { padding: 4px 8px; }
    body.touch #keys button { height: 30px; }
    body.touch:not(.kb) #keys { display: none; }
  }
  /* Dragging scrolls the terminal, so the browser must not take the gesture.
     Touches also land on the stable screen element rather than a row: xterm
     replaces row elements as frames arrive, and a touch whose target left
     the page stops reaching any listener mid-drag. */
  body.touch #stage { touch-action: none; }
  body.touch .xterm-rows { pointer-events: none; }
</style>

<script>
(async () => {
  const params = new URLSearchParams(location.hash.slice(1));
  // #t=<token>: a page on this Mac, plain WebSocket to Kaku on loopback.
  // Through the relay a browser is paired: #<one-time secret> from
  // `kaku remote` pairs it once (older Kaku wrote #p=<secret>&m=<its key>),
  // and the browser keeps its own signing key, which it cannot export, in
  // IndexedDB. Fragments are never sent to servers, and are erased from the
  // address at once.
  const bareSecret = /^[A-Za-z0-9_-]{22}$/.test(location.hash.slice(1)) ? location.hash.slice(1) : null;
  const supplied = !!bareSecret || params.has("t") || params.has("p") || params.has("k");
  // A local token lives in this tab only (it changes with every Kaku launch),
  // so a reload finds it there. Relay links from before pairing kept a key
  // in the same slot; it no longer opens anything, so it is dropped.
  const LINK_SLOT = "kaku.link:" + location.pathname;
  let tabLink = null;
  try { tabLink = JSON.parse(sessionStorage.getItem(LINK_SLOT) || "null"); } catch (_) {}
  try { localStorage.removeItem(LINK_SLOT); } catch (_) {}
  const token = params.get("t") || (!supplied && tabLink && tabLink.t) || null;
  if (supplied) history.replaceState(null, "", location.pathname + location.search);
  try {
    if (params.has("t")) sessionStorage.setItem(LINK_SLOT, JSON.stringify({ t: token }));
    else if (tabLink && !tabLink.t) sessionStorage.removeItem(LINK_SLOT);
  } catch (_) {
    // If storage is blocked, keep the only usable copy for reloads.
    if (params.has("t")) history.replaceState(null, "", location.pathname + location.search + "#t=" + encodeURIComponent(token));
  }
  const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const bar = document.getElementById("bar");
  const tabsEl = document.getElementById("tabs");
  const toolsEl = document.getElementById("tools");
  const stage = document.getElementById("stage");
  const termEl = document.getElementById("term");
  // Inline image state (see onImage): declared early because fit() and
  // attach() reach it.
  const imageFiles = new Map();
  let imagePlacements = [];
  const imagesEl = document.createElement("div");
  imagesEl.id = "images";
  const historyBtn = document.getElementById("history");

  const showMessage = (text) => {
    stage.innerHTML = '<div id="message"><img src="assets/icon.png" alt=""><div></div></div>';
    stage.querySelector("#message div").textContent = text;
  };
  const relay = !token;
  if (relay && !(window.crypto && crypto.subtle && window.indexedDB)) {
    showMessage("This browser cannot open an encrypted Kaku connection.");
    return;
  }

  // ── Pairing ────────────────────────────────────────────────────────────
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const fromBase64Url = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const sameBytes = (a, b) => !!a && !!b && a.length === b.length && a.every((v, i) => v === b[i]);
  const toBase64Url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  // This Mac's relay id, which both sides sign over.
  const hostId = location.pathname.split("/").find((part) => /^[0-9a-f]{32}$/.test(part)) || "";
  // Keyed by the id, so /<id> and /<id>/ find the same paired device.
  const DEVICE_SLOT = hostId ? "/" + hostId + "/" : location.pathname;
  const RELAY = (document.querySelector('meta[name="kaku-relay"]')?.content || "").replace(/\/+$/, "");
  const deviceStore = (mode, work) => new Promise((resolve, reject) => {
    const open = indexedDB.open("kaku", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("devices");
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction("devices", mode);
      const req = work(tx.objectStore("devices"));
      tx.oncomplete = () => { open.result.close(); resolve(req.result); };
      tx.onerror = () => { open.result.close(); reject(tx.error); };
    };
  });
  const loadDevice = () => deviceStore("readonly", (s) => s.get(DEVICE_SLOT)).catch(() => null);
  const saveDevice = (device) => deviceStore("readwrite", (s) => s.put(device, DEVICE_SLOT));
  const forgetDevice = () => deviceStore("readwrite", (s) => s.delete(DEVICE_SLOT)).catch(() => {});
  const deviceName = () => {
    const ua = navigator.userAgent;
    const browser = /Edg\//.test(ua) ? "Edge" : /Firefox\//.test(ua) ? "Firefox"
      : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "Browser";
    const os = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android"
      : /Mac OS X/.test(ua) ? "macOS" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "";
    return os ? `${browser} on ${os}` : browser;
  };

  // The browser's identity with this Mac: the Mac's public key and the
  // browser's own key pair. `pairing` holds a link's secret until the Mac
  // has admitted this browser, which is when the identity is saved.
  let device = null;
  let pairing = null;
  if (relay) {
    if (bareSecret || (params.has("p") && params.has("m"))) {
      // Without the Mac's key in the link, Kaku sends it in the handshake
      // and the link's secret checks it (see prove).
      let macPub = null, secret;
      try {
        secret = fromBase64Url(bareSecret || params.get("p"));
        if (!bareSecret) macPub = fromBase64Url(params.get("m"));
        if (secret.length !== 16 || (macPub && macPub.length !== 65)) throw new Error();
      } catch (_) {
        showMessage("This pairing link is incomplete. Run kaku remote on the Mac for a new one.");
        return;
      }
      const known = await loadDevice();
      // The same browser opening a new link keeps its key; with the key
      // still to come, prove swaps in a new one if the Mac turns out to be
      // another.
      const keys = known && known.keys && (!macPub || sameBytes(known.macPub, macPub)) ? known.keys
        : await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
      device = { macPub, keys, publicKey: new Uint8Array(await crypto.subtle.exportKey("raw", keys.publicKey)), knownMacPub: known && known.macPub };
      pairing = { secret };
    } else if (params.has("k")) {
      showMessage("This link is from an earlier Kaku. Run kaku remote on the Mac to pair this browser.");
      return;
    } else {
      const known = await loadDevice();
      if (known && known.keys && known.macPub) device = known;
    }
    if (!device) {
      showMessage("Pair this browser first: run kaku remote on the Mac and open the link it shows.");
      return;
    }
  }
  let paired = !pairing;
  // Waiting for Enter in `kaku remote` on the Mac: only the handshake's
  // messages go out meanwhile.
  let pendingPair = false;
  // The six digits `kaku remote` shows for this browser: an HMAC under the
  // link's secret of this browser's key, as the Mac computes it.
  const pairingCode = async () => {
    const label = enc.encode("kaku-remote pairing code");
    const key = await crypto.subtle.importKey("raw", pairing.secret, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const data = new Uint8Array(label.length + device.publicKey.length);
    data.set(label);
    data.set(device.publicKey, label.length);
    const tag = new DataView(await crypto.subtle.sign("HMAC", key, data));
    const n = String(tag.getUint32(0) % 1000000).padStart(6, "0");
    return n.slice(0, 3) + " " + n.slice(3);
  };
  const finishPairing = () => {
    if (!pairing) return;
    pairing = null;
    paired = true;
    saveDevice({ macPub: device.macPub, keys: device.keys, publicKey: device.publicKey })
      .then(() => toast("Paired. Bookmark this page to come back."))
      .catch(() => toast("Paired for this tab only, since this browser does not keep site data."));
  };

  // ── Transport ──────────────────────────────────────────────────────────
  const TO_HOST = enc.encode("kaku-web c2h");
  const FROM_HOST = enc.encode("kaku-web h2c");
  const MAC_HELLO = "KCH3";
  const PAGE_HELLO = "KCB3";

  const wsUrl = () => {
    const scheme = location.protocol === "https:" ? "wss://" : "ws://";
    if (relay) {
      if (RELAY) return RELAY + "/" + hostId + "/ws";
      const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
      return scheme + location.host + base + "ws";
    }
    return scheme + location.host + "/web/ws?token=" + encodeURIComponent(token);
  };

  let ws = null;
  // Through the relay, each connection starts with a fresh ECDH exchange:
  // Kaku sends its ephemeral key in the clear, the page answers with its
  // own, and both derive one AES-GCM key per direction. Kaku then signs the
  // exchange with the key this browser paired with, so the page only talks
  // to that Mac, and the page signs it with its device key (adding the
  // pairing link's proof the first time), so Kaku only talks to a paired
  // browser. Every message is bound to its direction and position, and
  // nothing the page queues is sent before both signatures.
  let link = null;
  const newLink = () => {
    let ready;
    const promise = new Promise((resolve) => { ready = resolve; });
    return { keys: null, transcript: null, verified: false, sendSeq: 0, recvSeq: 0, ready, promise };
  };
  const aad = (label, seq) => {
    const out = new Uint8Array(label.length + 8);
    out.set(label);
    new DataView(out.buffer).setBigUint64(label.length, BigInt(seq));
    return out;
  };
  const seal = async (conn, json) => {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const additionalData = aad(TO_HOST, conn.sendSeq++);
    const sealed = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData }, conn.keys.toHost, enc.encode(json)));
    const out = new Uint8Array(12 + sealed.length);
    out.set(iv);
    out.set(sealed, 12);
    return out;
  };
  const exchange = async (socket, conn, bytes) => {
    if (bytes.length !== 69 || dec.decode(bytes.slice(0, 4)) !== MAC_HELLO) throw new Error("no hello");
    const macEph = bytes.slice(4);
    const mine = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
    const pageEph = new Uint8Array(await crypto.subtle.exportKey("raw", mine.publicKey));
    const hello = new Uint8Array(69);
    hello.set(enc.encode(PAGE_HELLO));
    hello.set(pageEph, 4);
    if (socket.readyState === WebSocket.OPEN) socket.send(hello);
    const label = enc.encode("kaku-remote v3");
    const id = enc.encode(hostId);
    const all = new Uint8Array(label.length + id.length + 130);
    all.set(label);
    all.set(id, label.length);
    all.set(macEph, label.length + id.length);
    all.set(pageEph, label.length + id.length + 65);
    conn.transcript = new Uint8Array(await crypto.subtle.digest("SHA-256", all));
    const peer = await crypto.subtle.importKey("raw", macEph, { name: "ECDH", namedCurve: "P-256" }, false, []);
    const shared = await crypto.subtle.deriveBits({ name: "ECDH", public: peer }, mine.privateKey, 256);
    const hkdf = await crypto.subtle.importKey("raw", shared, "HKDF", false, ["deriveKey"]);
    const derive = (info) => crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: conn.transcript, info: enc.encode(info) },
      hkdf, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    conn.keys = { toHost: await derive("kaku c2h"), fromHost: await derive("kaku h2c") };
  };
  // Kaku's signature checks out: prove this browser, then let queued
  // messages go. A link without the Mac's key takes it from Kaku's message
  // once its tag, an HMAC under the link's secret that the relay never sees,
  // matches this connection and that key.
  const MAC_KEY_LABEL = enc.encode("kaku-remote mac key");
  const prove = async (socket, conn, msg) => {
    if (!device.macPub) {
      // Kaku holds no fresh link: it was used or ran out.
      if (!msg.tag) throw new Error("link expired");
      const macPub = fromBase64Url(msg.key || "");
      const secret = await crypto.subtle.importKey("raw", pairing.secret, { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
      const tagged = new Uint8Array(MAC_KEY_LABEL.length + conn.transcript.length + macPub.length);
      tagged.set(MAC_KEY_LABEL);
      tagged.set(conn.transcript, MAC_KEY_LABEL.length);
      tagged.set(macPub, MAC_KEY_LABEL.length + conn.transcript.length);
      if (macPub.length !== 65 || !await crypto.subtle.verify("HMAC", secret, fromBase64Url(msg.tag), tagged)) {
        throw new Error("not this Mac");
      }
      if (device.knownMacPub && !sameBytes(device.knownMacPub, macPub)) {
        device.keys = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
        device.publicKey = new Uint8Array(await crypto.subtle.exportKey("raw", device.keys.publicKey));
      }
      device.macPub = macPub;
    }
    const sig = msg.sig;
    const macKey = await crypto.subtle.importKey("raw", device.macPub, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
    const genuine = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, macKey, fromBase64Url(sig), conn.transcript);
    if (!genuine) throw new Error("not this Mac");
    const signed = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, device.keys.privateKey, conn.transcript);
    const proof = { type: "auth", device: toBase64Url(device.publicKey), sig: toBase64Url(signed) };
    // Kaku deflates this session's text for a page that can inflate it.
    if (await inflateWorks) {
      proof.deflate = true;
      conn.inflate = inflater();
    }
    if (pairing) {
      const secret = await crypto.subtle.importKey("raw", pairing.secret, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      proof.type = "pair";
      proof.proof = toBase64Url(await crypto.subtle.sign("HMAC", secret, conn.transcript));
      proof.name = deviceName();
    }
    const sealed = await seal(conn, JSON.stringify(proof));
    if (socket.readyState === WebSocket.OPEN) socket.send(sealed);
    conn.verified = true;
    conn.ready();
  };
  // Sealing and opening are async; chain them so messages keep their order.
  let sendChain = Promise.resolve();
  let recvChain = Promise.resolve();
  // Anything typed, from any key path (keyboard, the phone's key row,
  // paste), goes back to the live screen first, as on the Mac.
  const INPUT_TYPES = new Set(["key", "text", "paste"]);
  const send = (msg) => {
    const socket = ws;
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    if (pendingPair) return;
    if (INPUT_TYPES.has(msg.type)) { stopScrolling(); closePast(); takeBack(); }
    // Zoom changes the pane's share of its tab. Let its next frame reclaim
    // our grid after the Mac has applied the zoom, even if our size is unchanged.
    if (msg.type === "zoom_pane" && msg.pane_id === paneId) claimed = "";
    const json = JSON.stringify(msg);
    const path = direct;
    // The heartbeat stays on the session: the relay drops a browser it has
    // not heard from in 150 s, and on an idle path nothing else reaches it.
    if (msg.type !== "ping" && path && path.open && !path.paused && path.socket === socket && json.length < DIRECT_PIECE && path.dc.readyState === "open") {
      path.dc.send(json);
      return;
    }
    if (!relay) { socket.send(json); return; }
    const conn = link;
    sendChain = sendChain.then(async () => {
      const out = await seal(conn, json);
      if (socket.readyState === WebSocket.OPEN) socket.send(out);
    }).catch(() => {});
    return sendChain;
  };
  let notThisMac = null;
  let linkExpired = null;
  // A desktop picture comes as one binary message: a zero byte, the length
  // of its JSON header, the header, then the video bytes.
  const unpackFrame = (bytes) => {
    const len = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(1);
    const msg = JSON.parse(dec.decode(bytes.subarray(5, 5 + len)));
    msg.bytes = bytes.subarray(5 + len);
    return msg;
  };
  // Kaku's deflated messages: one raw deflate stream per session, each
  // message flushed and ended by a newline (`share::deflate`).
  const inflater = () => {
    const stream = new DecompressionStream("deflate-raw");
    const writer = stream.writable.getWriter();
    const reader = stream.readable.getReader();
    const text = new TextDecoder();
    let out = "";
    return async (bytes) => {
      writer.write(bytes).catch(() => {});
      for (;;) {
        const end = out.indexOf("\n");
        if (end >= 0) {
          const msg = out.slice(0, end);
          out = out.slice(end + 1);
          return msg;
        }
        const { value, done } = await reader.read();
        if (done) throw new Error("sealed message did not open");
        out += text.decode(value, { stream: true });
      }
    };
  };
  // A browser whose DecompressionStream holds output back until the stream
  // ends could never read a message; it gets plain text instead.
  const inflateWorks = (async () => {
    try {
      const inflate = inflater();
      const first = new Uint8Array([170, 86, 42, 81, 178, 50, 172, 229, 2, 0, 0, 0, 255, 255]);
      const second = new Uint8Array([170, 134, 210, 0, 0, 0, 0, 255, 255]);
      const timeout = new Promise((resolve) => setTimeout(() => resolve(""), 500));
      const read = async () => (await inflate(first)) + (await inflate(second));
      return (await Promise.race([read(), timeout])) === '{"t":1}{"t":1}';
    } catch (_) { return false; }
  })();
  const receive = (socket, data, handle) => {
    if (!relay) { handle(typeof data === "string" ? JSON.parse(data) : unpackFrame(new Uint8Array(data))); return; }
    const conn = link;
    recvChain = recvChain.then(async () => {
      const bytes = new Uint8Array(data);
      if (!conn.keys) { await exchange(socket, conn, bytes); return; }
      let plain;
      try {
        plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12), additionalData: aad(FROM_HOST, conn.recvSeq++) }, conn.keys.fromHost, bytes.slice(12));
      } catch (_) {
        // Altered or replayed on the way: start over on a fresh connection.
        throw new Error("sealed message did not open");
      }
      const view = new Uint8Array(plain);
      if (view[0] === 0) {
        if (conn.verified) handle(unpackFrame(view));
        return;
      }
      if (view[0] === 1 && !conn.inflate) throw new Error("sealed message did not open");
      const msg = JSON.parse(view[0] === 1 ? await conn.inflate(view.subarray(1)) : dec.decode(plain));
      if (!conn.verified) {
        if (msg.type !== "mac_auth") throw new Error("not this Mac");
        await prove(socket, conn, msg);
        return;
      }
      handle(msg);
    }).catch((err) => {
      const why = err && err.message;
      if (why === "not this Mac" && notThisMac) { notThisMac(socket); return; }
      if (why === "link expired" && linkExpired) { linkExpired(socket); return; }
      if (/did not open|no hello/.test(why)) { if (ws === socket) socket.close(); return; }
      console.error("kaku web:", err);
    });
  };

  // ── Terminal ───────────────────────────────────────────────────────────
  let paneId = null;
  let tabId = null;
  // Kaku's own font size; the page only shrinks below it until Kaku has
  // resized the tab to this window.
  let baseFontSize = 15;
  const TOUCH = matchMedia("(pointer: coarse)").matches;
  // Back to the terminal after a tab, a pane, a dialog or a menu. On a touch
  // screen focus raises the keyboard, which then came up on every tab switch
  // (#597), so there only a tap on the terminal itself asks for it.
  const refocus = () => { if (!TOUCH) term.focus(); };
  // Empties the phone's compose box when the terminal's line moves on
  // without it; set once that box exists.
  let composeReset = () => {};
  if (TOUCH) document.body.classList.add("touch");
  // A phone: tabs in a drawer, typing through the compose box at the bottom,
  // and a tap on the terminal is a click for the program, never the keyboard.
  const PHONE_QUERY = matchMedia("(max-width: 640px), (max-height: 500px)");
  let phone = TOUCH && PHONE_QUERY.matches;
  document.body.classList.toggle("phone", phone);
  let fontSize = baseFontSize;
  let size = { cols: 0, rows: 0 };
  let retry = 0;

  // What the page tells the user about the link, over the terminal. A stale
  // screen dims so it does not pass for a live one.
  const noticeEl = document.getElementById("notice");
  let noticeTimer = 0;
  let everConnected = false;
  // Connecting and offline pages carry the Kaku mark, and on a relay link
  // say that what passes through it is sealed end to end.
  noticeEl.querySelector(".trust").classList.toggle("on", relay);
  // "link": about the connection, cleared as soon as Kaku answers.
  // "tabs": about what Kaku has open, cleared only when that changes.
  let noticeKind = "link";
  const setNotice = (title, detail = "", { stale = false, delay = 0, brand = false, kind = "link" } = {}) => {
    clearTimeout(noticeTimer);
    noticeKind = kind;
    const apply = () => {
      noticeEl.querySelector(".title").textContent = title;
      noticeEl.querySelector(".detail").textContent = detail;
      noticeEl.classList.toggle("has-detail", !!detail);
      noticeEl.classList.toggle("brand", brand || !everConnected);
      noticeEl.classList.toggle("show", !!title);
      document.body.classList.toggle("stale", !!title && stale);
      // The link itself is down, not only this tab (the Mac's screen dims too).
      document.body.classList.toggle("offline", !!title && stale && kind === "link");
    };
    if (delay && title) noticeTimer = setTimeout(apply, delay);
    else apply();
  };
  const clearNotice = (kind = "link") => { if (noticeKind === kind) setNotice(""); };

  // Kaku's own fallback order (JetBrains Mono, PingFang SC, Apple Symbols,
  // Apple Color Emoji), then the Windows equivalents for CJK and emoji.
  // No emoji font by name: listed, it drew the symbols Claude Code colors by
  // status (⏺ ✳) as fixed-color emoji whenever the fonts before it lacked
  // them. The browser's own fallback still gives real emoji (✅) the emoji
  // font and draws text-style symbols in the text color, as Kaku does.
  // The icons follow Kaku Mono, ahead of Segoe UI Symbol, whose own private
  // use glyphs would otherwise take them on Windows.
  const FONT_FALLBACKS = ["Kaku Mono", "Kaku Symbols", "PingFang SC", "Apple Symbols", "Microsoft YaHei", "Segoe UI Symbol"];
  // The families of Kaku's font config in its order, JetBrains Mono being
  // the bundled copy, then the page's fallbacks it did not name.
  const fontStack = (families) => {
    const names = [];
    const add = (name) => {
      name = String(name).replace(/["\\]/g, "");
      if (name && !/emoji/i.test(name) && !names.some((n) => n.toLowerCase() === name.toLowerCase())) names.push(name);
    };
    for (const family of families) {
      if (/^jetbrains mono$/i.test(family)) { add("Kaku Mono"); add("Kaku Symbols"); } else add(family);
    }
    FONT_FALLBACKS.forEach(add);
    return names.map((n) => '"' + n + '"').join(", ") + ", monospace";
  };
  const FONT_STACK = fontStack([]);
  const term = new Terminal({
    fontSize,
    fontFamily: FONT_STACK,
    cursorBlink: true,
    cursorInactiveStyle: "bar",
    scrollback: 0,
    allowTransparency: false,
    // Bold text draws at the regular weight: heavier glyphs read as smeared
    // in the browser.
    fontWeightBold: "normal",
    // term.unicode, below, is still a proposed API.
    allowProposedApi: true,
    theme: { background: getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#16161a" },
  });
  term.open(termEl);
  // Kaku measures characters by Unicode 14, which gives emoji such as ✅ and
  // ⚡ two cells. xterm.js defaults to Unicode 6 and gives them one, so every
  // row holding one read as drifted from the Mac and was redrawn every few
  // seconds. Unicode 11 widths match Kaku for these.
  term.loadAddon(new Unicode11Addon.Unicode11Addon());
  term.unicode.activeVersion = "11";
  // WebGL draws the grid on one canvas, so Claude Code redrawing several
  // times a second no longer rebuilds DOM rows and restarts CSS cursor
  // animations. Without WebGL the DOM renderer draws instead.
  //
  // Browsers drop the GPU context of a background tab under memory
  // pressure. The addon then waits about 3 s for it to come back before
  // giving up, and meanwhile the grid is blank, or Chrome's lost-context
  // image once output arrives: the garbled screen on returning to the tab.
  // So the DOM renderer takes over the moment the context is lost, and
  // WebGL comes back when the page is next in front, unless the GPU keeps
  // dropping it.
  let webgl = null;
  let webglLosses = [];
  const dropWebgl = () => {
    if (!webgl) return;
    const lost = webgl;
    webgl = null;
    webglLosses.push(Date.now());
    // Not from inside the addon's own context-lost handler.
    setTimeout(() => {
      try { lost.dispose(); } catch (_) {}
      term.refresh(0, term.rows - 1);
    });
  };
  const useWebgl = () => {
    if (!window.WebglAddon || webgl || document.hidden) return;
    webglLosses = webglLosses.filter((at) => Date.now() - at < 600000);
    if (webglLosses.length >= 3) return;
    try {
      const addon = new WebglAddon.WebglAddon();
      addon.onContextLoss(dropWebgl);
      // Once its glyph pages are full, the addon merges four into one in
      // the middle of a frame, moving glyphs the rest of that frame still
      // draws from their old places: one frame of wrong letters, which stays
      // until something else redraws (maintainer, 2026-10-16 and 2026-10-21,
      // switching tabs). Draw the whole grid again before that frame shows.
      addon.onRemoveTextureAtlasCanvas(() => { atlasMerged = true; });
      term.loadAddon(addon);
      webgl = addon;
      for (const canvas of termEl.querySelectorAll("canvas")) {
        canvas.addEventListener("webglcontextlost", dropWebgl, { once: true });
      }
    } catch (_) {}
  };
  let atlasMerged = false;
  term.onRender(() => {
    const renderer = term._core?._renderService?._renderer?.value;
    for (let i = 0; atlasMerged && i < 3; i++) {
      atlasMerged = false;
      // Every cell, not only the ones the renderer thinks changed: a cell
      // whose text stayed kept the glyph place it had before the merge, and
      // the last column showed the previous tab's letter until a redraw.
      // And every texture again: the addon uploads a page to its slot only
      // when the page's version differs from the slot's last upload, a merge
      // moves pages to other slots, and versions repeat (every merged page
      // starts at 1), so a slot kept another page's glyphs (2026-10-25, the
      // merge test at 10x CPU throttling: a slot's texture and its page
      // differed with both at version 4). setAtlas forgets what each slot
      // holds.
      try {
        renderer._glyphRenderer.value?.setAtlas(renderer._charAtlas);
        renderer._clearModel(true);
        renderer.renderRows(0, term.rows - 1);
      } catch (_) { term.refresh(0, term.rows - 1); }
    }
  });
  useWebgl();
  document.addEventListener("visibilitychange", useWebgl);
  // Rebuilding the atlas is kept for fonts that arrive late. It used to run
  // on every tab switch and focus too, against the wrong letters above, but
  // a rebuild never hands merged pages back, so it only made merges, and
  // their bad frames, several times more frequent (Helium on Metal, 60
  // switches over six tabs: 52 merges with it, 12 without).
  // Counted for the Mac's log, next to how the page draws.
  let atlasResets = 0;
  const freshGlyphs = () => {
    if (webgl && !document.hidden) { try { term.clearTextureAtlas(); atlasResets++; } catch (_) {} }
  };
  // A font that arrives after its characters were drawn: the bundled icons
  // load only once one is on screen, and the user's fonts come from the Mac.
  // WebGL keeps the box it drew in the meantime until the atlas is rebuilt.
  document.fonts.addEventListener("loadingdone", () => {
    if (!webgl || document.hidden) return;
    freshGlyphs();
    term.refresh(0, term.rows - 1);
  });

  // Links: URLs in the screen open with Cmd+click (Ctrl+click off the Mac),
  // as in Kaku. Cells and string positions differ once a row holds wide
  // characters, so the row is read cell by cell with each one's column.
  const URL_RE = /https?:\/\/[^\s<>"'`，。；：！？、（）【】「」『』“”‘’]+/gi;
  const linkText = candidate => {
    const stack = [];
    const pairs = { ")": "(", "]": "[", "}": "{" };
    for (let i = 0; i < candidate.length; i++) {
      const ch = candidate[i];
      if ("([{".includes(ch)) stack.push(ch);
      else if (pairs[ch]) {
        if (stack.at(-1) !== pairs[ch]) return candidate.slice(0, i).replace(/[.,;:!?]+$/, "");
        stack.pop();
      }
    }
    return candidate.replace(/[.,;:!?]+$/, "");
  };
  // Chinese sentence punctuation ends a path as it ends a URL; Chinese
  // file names (~/桌面/截图.png) stay inside it.
  const PATH_RE = /(?<![\w:/.~-])(?:~|\.{1,2})?\/[^\s"'`<>|;()\[\]{}，。；：！？、（）【】「」『』“”‘’]+/g;
  // A row's text read cell by cell, with the column each UTF-16 unit sits
  // in, the column after its last visible character, and whether the next
  // row continues it (the wrap attribute).
  const readRow = (index) => {
    const buffer = term.buffer.active;
    const line = buffer.getLine(index);
    if (!line) return null;
    let text = "", end = 0, cell;
    const cols = [];
    for (let x = 0; x < line.length; x++) {
      cell = line.getCell(x, cell);
      if (!cell || cell.getWidth() === 0) continue;
      const chars = cell.getChars() || " ";
      if (chars.trim()) end = x + cell.getWidth();
      for (const ch of chars) {
        text += ch;
        for (let i = 0; i < ch.length; i++) cols.push(x);
      }
    }
    return { line, text, cols, end, soft: !!buffer.getLine(index + 1)?.isWrapped };
  };
  const pathOf = (match) => match.replace(/[.,:;!?]+$/, "");
  // A path a TUI wrapped itself: Claude Code and Codex break a long token
  // with a real newline and an indent, so no row carries the wrap attribute
  // and neither fragment is the path (#547). As in Kaku's own hover, rows
  // are joined up to four either side, a hard break dropping the trailing
  // blanks above and the indent below, and a joined path counts only once
  // the Mac says it exists: joining by shape alone was reverted twice in
  // Kaku because unrelated output can make up a target.
  const WRAP_SPAN = 4;
  const rejoinedPaths = (index) => {
    const rows = new Map();
    const row = (i) => { if (!rows.has(i)) rows.set(i, readRow(i)); return rows.get(i); };
    if (!row(index)?.text.trim()) return [];
    const joins = (upper) => {
      const above = row(upper), below = row(upper + 1);
      return !!above && !!below && (above.soft || (!!above.text.trim() && !!below.text.trim()));
    };
    let first = index, last = index;
    while (first > 0 && index - first < WRAP_SPAN && joins(first - 1)) first--;
    while (last - index < WRAP_SPAN && joins(last)) last++;
    const spans = [];
    for (let top = first; top <= index; top++) for (let bottom = index; bottom <= last; bottom++) if (top !== bottom) spans.push([top, bottom]);
    spans.sort((x, y) => (y[1] - y[0]) - (x[1] - x[0]));
    const found = [];
    for (const [top, bottom] of spans) {
      let joined = "", hovered = null;
      const pieces = [];
      for (let i = top; i <= bottom; i++) {
        const r = row(i);
        let piece = r.text, lead = 0;
        if (i > top && !row(i - 1).soft) { const t = piece.trimStart(); lead = piece.length - t.length; piece = t; }
        if (i < bottom && !r.soft) piece = piece.trimEnd();
        if (i === index) hovered = [joined.length, joined.length + piece.length];
        pieces.push({ i, start: joined.length, lead, len: piece.length });
        joined += piece;
      }
      for (const m of joined.matchAll(PATH_RE)) {
        const path = pathOf(m[0]);
        const from = m.index, to = m.index + path.length;
        // Only a path that runs across the hovered row's edge.
        if (to <= hovered[0] || from >= hovered[1] || (from >= hovered[0] && to <= hovered[1])) continue;
        if (found.some((f) => f.path === path)) continue;
        const segments = pieces.flatMap(({ i, start, lead, len }) => {
          const a = Math.max(from, start), b = Math.min(to, start + len);
          return a < b ? [{ i, from: lead + a - start, to: lead + b - start }] : [];
        });
        found.push({ path, segments });
      }
    }
    return found;
  };
  // What the Mac said about each joined path, by pane, and the questions
  // still out. A Kaku that predates the question never answers; after a
  // moment the path counts as missing. Missing is asked again after a few
  // seconds, for a file written after its path was printed.
  const pathExists = new Map();
  const knownPath = (key) => {
    const known = pathExists.get(key);
    if (known && !known.exists && Date.now() - known.at > 5000) pathExists.delete(key);
    return pathExists.get(key);
  };
  const pathQuestions = new Map();
  let pathSeq = 0;
  const askPathsExist = (paths) => {
    const pane = paneId;
    const key = (path) => `${pane}\n${path}`;
    const unknown = paths.filter((path) => !knownPath(key(path))).slice(0, 8);
    if (!unknown.length || !ws || ws.readyState !== WebSocket.OPEN) return Promise.resolve();
    const id = ++pathSeq;
    return new Promise((resolve) => {
      const done = (exists = []) => {
        if (!pathQuestions.delete(id)) return;
        unknown.forEach((path, i) => pathExists.set(key(path), { exists: exists[i] === true, at: Date.now() }));
        resolve();
      };
      pathQuestions.set(id, done);
      setTimeout(done, 600);
      send({ type: "paths_exist", id, paths: unknown, pane_id: pane });
    });
  };
  term.registerLinkProvider({
    provideLinks(y, callback) {
      const row = readRow(y - 1);
      if (!row) return callback(undefined);
      const { line, text, cols } = row;
      const links = [];
      const range = (index, length) => {
        const start = cols[index];
        const end = cols[index + length - 1];
        return { start: { x: start + 1, y }, end: { x: end + Math.max(1, line.getCell(end)?.getWidth() || 1), y } };
      };
      const urls = [];
      for (const m of text.matchAll(URL_RE)) {
        const uri = linkText(m[0]);
        urls.push([m.index, m.index + uri.length]);
        links.push({
          range: range(m.index, uri.length),
          text: uri,
          activate: (ev, uri) => {
            if (ev.metaKey || ev.ctrlKey) window.open(uri, "_blank", "noopener");
          },
        });
      }
      // Paths on the Mac (~/..., /..., ./...): Cmd+click downloads the file.
      const pathLink = (rangeOf, path) => ({
        range: rangeOf,
        text: path,
        hover: (ev) => { hoveredPath = path; previewImage(ev, path); },
        leave: () => { hoveredPath = null; hideImagePreview(); },
        activate: (ev) => {
          if (ev.metaKey || ev.ctrlKey) download(path);
        },
      });
      const own = [];
      for (const m of text.matchAll(PATH_RE)) {
        const path = pathOf(m[0]);
        if (path.length < 2 || urls.some(([a, b]) => m.index < b && m.index + path.length > a)) continue;
        own.push({ from: m.index, to: m.index + path.length, link: pathLink(range(m.index, path.length), path) });
      }
      const joined = rejoinedPaths(y - 1).filter(({ segments }) => !segments.some(({ i, from, to }) =>
        i === y - 1 && urls.some(([a, b]) => from < b && to > a)));
      const finish = () => {
        const pane = paneId;
        const kept = joined.filter(({ path }) => knownPath(`${pane}\n${path}`)?.exists);
        for (const { path, segments } of kept) {
          const head = segments[0], tail = segments.at(-1);
          const headRow = readRow(head.i), tailRow = readRow(tail.i);
          const endCol = tailRow.cols[tail.to - 1];
          links.push(pathLink({
            start: { x: headRow.cols[head.from] + 1, y: head.i + 1 },
            end: { x: endCol + Math.max(1, tailRow.line.getCell(endCol)?.getWidth() || 1), y: tail.i + 1 },
          }, path));
        }
        // A fragment of a joined path is not a link of its own.
        for (const o of own) {
          if (!kept.some(({ segments }) => segments.some(({ i, from, to }) => i === y - 1 && o.from < to && o.to > from))) links.push(o.link);
        }
        callback(links.length ? links : undefined);
      };
      if (!joined.length) return finish();
      askPathsExist(joined.map(({ path }) => path)).then(finish);
    },
  });

  // The terminal sits at the top left with an 8px margin. Cell size comes
  // from xterm.js, which re-measures synchronously when the font changes,
  // so sizing needs no waiting for a frame and no guessing from a scaled font.
  const MARGIN = 8;
  const cellSize = () => {
    const cell = term._core && term._core._renderService && term._core._renderService.dimensions.css.cell;
    if (cell && cell.width && cell.height) return cell;
    const screen = termEl.querySelector(".xterm-screen");
    if (!screen || !term.cols) return null;
    const rect = screen.getBoundingClientRect();
    return { width: rect.width / term.cols, height: rect.height / term.rows };
  };
  const setFont = (px) => {
    if (Math.abs(px - fontSize) < 0.05) return;
    fontSize = px;
    term.options.fontSize = px;
    // On a phone the terminal runs below Kaku's size; the tab titles follow
    // it, as Kaku's own tab bar uses the terminal's size.
    if (TOUCH) document.documentElement.style.setProperty("--bar-font", Math.max(11, px) + "px");
  };
  // Pinch to make the text larger or smaller on a phone, kept per browser.
  let userScale = 1;
  try { userScale = Number(localStorage.getItem("kaku.scale")) || 1; } catch (_) {}

  // Ask Kaku to size the tab to the grid this window holds at Kaku's font
  // size. The Mac takes the tab back on its next local input, and the page
  // claims it again on its own next input.
  let claimed = "";
  // The last frame's grid is not the one this page claimed: the Mac took
  // the tab back for its own window.
  let macSized = false;
  // On a phone, Kaku's own size leaves about 38 columns on a portrait screen,
  // and the tab on the Mac narrows to match. Size the font for about 50
  // columns across the screen's shorter side, so landscape gets more. The
  // screen, not the window, so the keyboard opening does not change it.
  const PHONE_COLS = 50;
  const claimFont = () => {
    if (!TOUCH) return baseFontSize;
    setFont(baseFontSize);
    const cell = cellSize();
    if (!cell) return baseFontSize;
    const across = Math.min(screen.width, screen.height) - MARGIN * 2;
    const px = Math.floor((baseFontSize * across) / (PHONE_COLS * cell.width) * userScale * 4) / 4;
    return Math.max(8, Math.min(baseFontSize * 1.6, px));
  };
  let fontReady = false;
  // A tab split on the Mac keeps the Mac's layout, however many splits it
  // has: the page shows the one in view at its own size and claims none.
  const splitView = () => {
    const tab = tabs.find((t) => t.tab_id === tabId);
    return !!tab && (tab.panes || []).length > 1 && !tab.zoomed;
  };
  // A page opened on a tab the Mac had sized gets its first frames at the
  // Mac window's grid, before its own claim lands, and showed them for a
  // moment. The first time, the terminal stays unseen (still focusable)
  // until a frame has the grid it claimed, or a split's own, or for at most
  // REVEAL_WAIT.
  const REVEAL_WAIT = 600;
  let revealTimer = 0;
  let sized = false;
  const reveal = () => {
    clearTimeout(revealTimer);
    sized = true;
    document.body.classList.remove("sizing");
  };
  const revealWhenSized = () => {
    if (sized || !size.cols) return;
    if (claimed === size.cols + "x" + size.rows || splitView()) { reveal(); return; }
    if (!revealTimer) {
      document.body.classList.add("sizing");
      revealTimer = setTimeout(reveal, REVEAL_WAIT);
    }
  };
  const fit = () => {
    if (stage.clientWidth <= MARGIN * 2 || stage.clientHeight <= MARGIN * 2) return;
    const want = claimFont();
    setFont(want);
    const base = cellSize();
    if (!base) return;
    // Kaku's tab bar is one terminal row, so on a desktop the page's bar is
    // too; touch screens keep their finger-sized bar. Measure the stage
    // after the bar has its height, or the claim is a row off and corrected
    // a moment later, redrawing the app twice.
    if (!TOUCH) document.documentElement.style.setProperty("--bar-h", Math.round(base.height) + "px");
    const availW = stage.clientWidth - MARGIN * 2;
    const availH = stage.clientHeight - MARGIN * 2;
    if (availW <= 0 || availH <= 0) return;
    // No claim until Kaku's font size and the bundled face are in: a size
    // measured on the fallback face is claimed and then corrected, and each
    // claim makes a full-screen app such as Claude Code redraw.
    const split = splitView();
    if (!split && fontReady && ws && ws.readyState === WebSocket.OPEN && paneId !== null) {
      const cols = Math.floor(availW / base.width);
      const rows = Math.floor(availH / base.height);
      const key = cols + "x" + rows;
      if (cols >= 20 && rows >= 5 && key !== claimed) {
        claimed = key;
        send({ type: "resize", cols, rows });
      }
      revealWhenSized();
    }
    // Until Kaku applies that size, the current grid may be larger than the
    // window; shrink the font just enough for it to fit. A split, smaller
    // than the page, grows to fill it, up to twice Kaku's size.
    if (!size.cols) return;
    let px = want;
    if (split) {
      const grow = Math.min(availW / (size.cols * base.width), availH / (size.rows * base.height), 2);
      if (grow > 1) { px = Math.floor(want * grow * 4) / 4; setFont(px); }
    }
    for (let i = 0; i < 40; i++) {
      const cell = cellSize();
      if (!cell || (size.cols * cell.width <= availW && size.rows * cell.height <= availH) || px <= 6) break;
      const scale = Math.min(availW / (size.cols * cell.width), availH / (size.rows * cell.height));
      px = Math.max(6, Math.min(px - 0.25, Math.floor(px * scale * 4) / 4));
      setFont(px);
    }
    if (imagePlacements.length) renderImages();
  };
  let resizeTimer = 0;
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 100);
  }).observe(stage);
  // Moving to a display with another pixel density changes the cell size
  // without resizing the page, which left a gap at the right and bottom until
  // the next input. Re-fit when the density changes.
  // The media query fires in browsers that report the change; the poll
  // covers the ones that only update devicePixelRatio.
  let density = window.devicePixelRatio;
  const densityChanged = () => {
    if (window.devicePixelRatio === density) return;
    density = window.devicePixelRatio;
    document.body.dataset.dpr = String(density);
    fit();
  };
  const watchDensity = () => {
    const mq = matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
    mq.addEventListener("change", () => { densityChanged(); watchDensity(); }, { once: true });
  };
  watchDensity();
  setInterval(densityChanged, 2000);
  // Coming back to the page means using it here: claim the tab's size again,
  // in case the Mac took it back meanwhile.
  const reclaim = () => { if (desktop?.active) return; macSized = false; claimed = ""; fit(); };
  // Typing here after the Mac took the tab back (its own keys or clicks,
  // the desktop view's among them) claims it again, as a click or coming
  // back to the page does; otherwise the grid stayed the Mac window's size
  // until the next click.
  const takeBack = () => { if (macSized) reclaim(); };
  window.addEventListener("focus", reclaim);
  // A press anywhere on the page means this side is in use, as a click in
  // the Mac window is for the Mac.
  document.addEventListener("pointerdown", reclaim, true);

  // Keys that are not plain text go to Kaku, which encodes them for the
  // pane's current modes. Plain characters and IME text arrive via onData.
  const NAMED = new Set(["Enter", "Tab", "Escape", "Backspace", "Delete", "Insert", "Home", "End",
    "PageUp", "PageDown", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"]);
  // Kaku's editing shortcuts (bundled kaku.lua), sent as the keys Kaku
  // turns them into. Cmd+R stays the browser's reload.
  const MAC_SHORTCUTS = {
    "meta+Backspace": { key: "u", ctrl: true },        // delete to line start
    "alt+Backspace": { key: "w", ctrl: true },         // delete previous word
    "meta+Delete": { key: "k", ctrl: true },           // delete to line end

  // Kaku's own wording (overlay/confirm_close_pane.rs).
  const CLOSE_TEXT = { tab: "Close this tab?", pane: "Close this pane?" };
  // The card's body keeps 16px from what it points at, 8px from the window.
  const POP_GAP = 16, POP_EDGE = 8, TIP_W = 16, POP_RADIUS = 10;
  const anchorRect = (anchor) => {
    // A tab is looked up again each time: the bar redraws its tabs.
    if (typeof anchor === "function") anchor = anchor();
    if (!anchor) return null;
    if (anchor instanceof Element) {
      const r = anchor.getBoundingClientRect();
      return r.width || r.height ? r : null;
    }
    return { left: anchor.x, right: anchor.x, top: anchor.y, bottom: anchor.y };
  };
  const placeDialog = () => {
    const at = anchorRect(dialogAnchor);
    const w = dialogCard.offsetWidth, h = dialogCard.offsetHeight;
    const vw = innerWidth, vh = innerHeight;
    let x, y, side = "";
    if (at) {
      const cx = (at.left + at.right) / 2;
      x = Math.min(Math.max(cx - w / 2, POP_EDGE), vw - w - POP_EDGE);
      if (at.bottom + POP_GAP + h + POP_EDGE <= vh) { side = "below"; y = at.bottom + POP_GAP; }
      else if (at.top - POP_GAP - h >= POP_EDGE) { side = "above"; y = at.top - POP_GAP - h; }
      if (side) {
        // The tip follows the anchor and stays clear of the rounded corners.
        const tip = Math.min(Math.max(cx - x - TIP_W / 2, POP_RADIUS), w - POP_RADIUS - TIP_W);
        dialogTip.style.left = tip + "px";
      }
    }
    if (!side) {
      const r = stage.getBoundingClientRect();
      x = Math.max(r.left + (r.width - w) / 2, POP_EDGE);
      y = r.bottom - 16 - h;
    }
    dialogCard.classList.toggle("below", side === "below");
    dialogCard.classList.toggle("above", side === "above");

  const askClose = (_title, kind = "tab", anchor = null) => new Promise((resolve) => {

      dialogAnchor = null;

  const LOCKED_KEYS = ["Escape", "KeyW", "KeyT", "BracketLeft", "BracketRight",
    "Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6", "Digit7", "Digit8", "Digit9"];

      const keys = IS_MAC
        ? ev.code === "KeyF" && ev.metaKey && ev.ctrlKey && !ev.altKey && !ev.shiftKey

      ev.stopImmediatePropagation();

    clock.className = "clock";

    const tick = () => {

      clearTimeout(clockTimer);

  }

  // Shortcuts: Cmd+/ (Ctrl+Shift+/ off the Mac) or the ? button.
  const helpEl = document.getElementById("help");
  const HELP = IS_MAC ? [
    ["⌘1–9", "Go to a tab"], ["⌘⇧[  ⌘⇧]", "Previous or next tab"], ["⌘T  ⌘W", "New or close tab"],
    ["⌘F", "Find in history"], ["⌘K", "Clear"], ["⇧↩", "New line without running"], ["⌘⇧↩", "Zoom the pane"],
    ["⌘ click", "Open a link"], ["⌥ click", "View an image"], ["Drop or paste", "Send files to ~/Downloads/Kaku"],
    ["Double click", "Rename a tab"], ["⌘/", "These shortcuts"],
  ] : [
    ["Ctrl+Shift+F", "Find in history"], ["Ctrl+Shift+C  V", "Copy or paste"], ["Shift+Enter", "New line without running"],
    ["Ctrl click", "Open a link"], ["Alt click", "View an image"], ["Drop or paste", "Send files to ~/Downloads/Kaku"],
    ["Double click", "Rename a tab"], ["Ctrl+Shift+/", "These shortcuts"],
  ];
  const helpList = helpEl.querySelector("dl");
  for (const [k, v] of HELP) {
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");

  }
  if (document.fullscreenEnabled && IS_MAC) {
    const note = document.createElement("dd");

    note.textContent = "The tab keys reach this page in full screen.";

  }
  const toggleHelp = (on = !helpEl.classList.contains("show")) => {
    helpEl.classList.toggle("show", on);
    if (relay && on) {
      let note = helpList.querySelector(".connection-note");
      if (!note) {

        note.className = "connection-note";
        note.style.gridColumn = "1 / -1";
        helpList.append(note);
      }
      note.textContent = paired
        ? "Bookmark this address to return in this browser. To add another browser, run kaku remote on the Mac."
        : "Pairing this browser with the Mac.";
    }

  };
  helpEl.addEventListener("click", () => toggleHelp(false));
  window.addEventListener("keydown", (ev) => {
    const isHelp = ev.code === "Slash" && !ev.altKey && (IS_MAC ? ev.metaKey && !ev.ctrlKey : ev.ctrlKey && ev.shiftKey && !ev.metaKey);
    if (isHelp) { ev.preventDefault(); ev.stopPropagation(); toggleHelp(); }
    else if (ev.key === "Escape" && helpEl.classList.contains("show")) { ev.preventDefault(); ev.stopPropagation(); toggleHelp(false); }
  }, true);
  // Tabs asked to close, shown gone until Kaku's list agrees, as the app
  // closes a tab on the click rather than a round trip later. One Kaku
  // keeps for longer than CLOSE_GRACE_MS comes back.
  const closing = new Map();
  let authoritativeTabs = [];
  const CLOSE_GRACE_MS = 3000;
  const closeTab = (t, anchor) => {
    // The confirmation points at the close mark that was clicked, else the
    // tab itself, or at the given spot.
    const mark = anchor === "mark";
    if (!anchor || mark) anchor = () => {
      const b = tabsEl.querySelector(`.tab[data-tab="${t.tab_id}"]`);
      return mark ? b?.querySelector(".close") : b;
    };
    const go = () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      send({ type: "close_tab", tab_id: t.tab_id });
      const rest = tabs.filter((x) => x.tab_id !== t.tab_id);
      if (!rest.length) return;
      const until = Date.now() + CLOSE_GRACE_MS;

      // recover even if its authoritative list never changes again.

        if (closing.get(t.tab_id) !== until) return;
        closing.delete(t.tab_id);

      }, CLOSE_GRACE_MS);

      if (t.tab_id === tabId) attach(rest[Math.min(at, rest.length - 1)], true);
      else renderTabs();
    };

  };
  const newTab = () => {
    followNewTab = new Set(tabs.map((t) => t.tab_id));
    followUntil = Date.now() + 5000;
    send({ type: "new_tab" });
  };

  const dotted = new Set();
  // Renaming happens in place in the tab; the tabs list arriving meanwhile
  // must not redraw the bar under the editor.
  let renaming = null;
  let dragTab = null;
  let scrolledTo = null;
  const renderTabs = () => {
    if (renaming) return;
    tabsEl.textContent = "";
    for (const t of tabs) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab";
      b.dataset.tab = String(t.tab_id);
      b.setAttribute("aria-current", String(t.tab_id === tabId));
      // Kaku marks a tab that wants attention (an unread bell, a paused or
      // failed task) with a trailing dot in its title; draw it as a dot.
      const title = t.title || "Tab";
      const attention = title.endsWith("•");
      const label = document.createElement("span");
      label.textContent = attention ? title.slice(0, -1).trimEnd() : title;
      const close = document.createElement("span");
      close.className = "close";
      close.innerHTML = '<svg viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1 1l6 6M7 1L1 7"/></svg>';
      close.title = "Close Tab";
      close.addEventListener("click", (ev) => {
        ev.stopPropagation();
        closeTab(t, "mark");
      });
      const slot = document.createElement("span");
      slot.className = "slot";
      // The dot fades in when it appears and out when it goes, in place.
      const had = dotted.has(t.tab_id);
      if (attention || had) {
        const dot = document.createElement("i");
        dot.className = "dot" + (attention ? (had ? "" : " in") : " out");
        if (!attention) dot.addEventListener("animationend", () => dot.remove());
        slot.append(dot);
      }
      if (attention) dotted.add(t.tab_id);
      else dotted.delete(t.tab_id);
      slot.append(close);
      b.append(label, slot);
      b.addEventListener("click", () => { if (t.tab_id !== tabId) attach(t, true); else refocus(); });
      // Double click renames, as on the Mac; right click opens the tab menu.
      b.addEventListener("auxclick", ev => { if (ev.button === 1) { ev.preventDefault(); closeTab(t); } });
      b.addEventListener("mousedown", ev => { if (ev.button === 1) ev.preventDefault(); });
      b.addEventListener("dblclick", () => renameTab(t));
      b.addEventListener("contextmenu", (ev) => {
        ev.preventDefault();
        openMenu(ev.clientX, ev.clientY, [
          ["New Tab", newTab],
          ["Rename Tab", () => renameTab(t)],
          null,
          ["Close Tab", () => closeTab(t)],
        ]);
      });
      // Drag a tab to reorder it within its Mac window.
      if (!TOUCH) {
        b.draggable = true;
        b.addEventListener("dragstart", (ev) => {
          dragTab = t;
          ev.dataTransfer.effectAllowed = "move";
          ev.dataTransfer.setData("text/x-kaku-tab", String(t.tab_id));
        });
        b.addEventListener("dragend", () => { dragTab = null; clearDropMarks(); });
        b.addEventListener("dragover", (ev) => {
          if (!dragTab || dragTab.window_id !== t.window_id || dragTab === t) return;

    add.type = "button";
    add.className = "add";
    add.textContent = "+";
    add.title = "New Tab";
    add.addEventListener("click", newTab);
    tabsEl.append(add);

    renderPanes();
    renderStatus();

    if (dialogDone) placeDialog();
  };
  // ── Phone: tab drawer ──────────────────────────────────────────────────
  const mobileSwitch = document.getElementById("mobile-switch"), mobileTabs = document.getElementById("mobile-tabs");
  const mobileList = document.getElementById("mobile-list"), mobileShade = document.getElementById("mobile-shade");
  const STATUS_LABELS = { working: "Working", blocked: "Needs input", done: "Done", error: "Error" };
  const plainTitle = (t) => (t.title || "Tab").replace(/\s*•$/, "");
  // Kaku's trailing dot, or the program saying it waits on the user.
  const wantsYou = (t) => (t.title || "").endsWith("•") || t.status === "blocked" || t.status === "error";
  const setMobileOpen = (open) => {
    mobileTabs.classList.toggle("show", open);
    mobileShade.classList.toggle("show", open);
