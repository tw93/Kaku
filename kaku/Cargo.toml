[package]
name = "kaku"
version = "0.28.0"
authors = ["Tw93 <hitw93@gmail.com>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The CLI is a library so kaku-gui can link it in: the release bundle ships
# one binary, and Contents/MacOS/kaku is a symlink to kaku-gui. The `kaku` bin
# target stays for `cargo run -p kaku` and the integration tests. It was a bin
# crate before, which never ran doc comments as tests.
[lib]
doctest = false

[features]
default = ["remote"]
remote = ["dep:kaku-remote"]

[dependencies]
anyhow.workspace = true
kaku-ai-utils.workspace = true
kaku-remote = { workspace = true, optional = true }
libc.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_fig.workspace = true
codec.workspace = true
config.workspace = true
crossterm.workspace = true
env-bootstrap.workspace = true
hostname.workspace = true
humantime.workspace = true
log.workspace = true
mux.workspace = true
portable-pty.workspace = true
regex.workspace = true
promise.workspace = true
ratatui.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
smol.workspace = true
tabout.workspace = true
tempfile.workspace = true
termwiz-funcs.workspace = true
termwiz.workspace = true
toml.workspace = true
toml_edit.workspace = true
umask.workspace = true
url.workspace = true
wezterm-client.workspace = true
wezterm-gui-subcommands.workspace = true
wezterm-term.workspace = true
wezterm-version.workspace = true

[target."cfg(unix)".dependencies]
termios.workspace = true

[lints]
workspace = true
